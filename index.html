  const out = {};
  let payload;
  try { payload = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${etDate.replace(/-/g, "")}`); }
  catch (e) { return out; }
  (payload.events || []).forEach(ev => {
    const comp = ev.competitions[0], teams = {};
    comp.competitors.forEach(c => { teams[c.homeAway] = alias[c.team.abbreviation] || c.team.abbreviation; });
    const st = ev.status || {}, name = (st.type || {}).name, period = parseInt(st.period || 0, 10) || 0;
    const clock = (Number(st.clock) || 0) / 60;
    const left = LIVE_DONE.has(name) ? 0 : period <= 0 ? 1 : period <= 4 ? Math.max(0, ((4 - period) * 12 + clock) / 48) : 0;
    out[`${teams.home}|${teams.away}`] = {status: name, left};
  });
  return out;
}

async function computeLiveBrowser(ctx, fetchJson, nowMs) {
  const out = {as_of_utc: new Date(nowMs).toISOString(), context_utc: ctx ? ctx.written_utc : null, games: {}, players: {}, source: "browser"};
  if (!ctx) return out;
  const started = Object.entries(ctx.games || {}).filter(([, g]) => { if (!g.tip_utc) return false;
    const dt = nowMs - Date.parse(g.tip_utc); return dt >= 0 && dt <= LIVE_IN_PLAY_MS; });
  if (!started.length) return out;
  const board = {};
  for (const d of [...new Set(started.map(([, g]) => liveEtDate(Date.parse(g.tip_utc))))].sort())
    Object.assign(board, await liveBoard(d, ctx.espn_alias || {}, fetchJson));
  started.forEach(([gid, g]) => {
    const b = board[`${g.home}|${g.away}`];
    const left = b ? b.left : Math.max(0, 1 - (nowMs - Date.parse(g.tip_utc)) / LIVE_GAME_MS);
    out.games[gid] = {status: b ? b.status : null, left: rnd(left, 3), final: !!(b && LIVE_DONE.has(b.status))};
  });
  const rows = await fetchJson(`https://api.sleeper.com/stats/nba/${ctx.season}/${ctx.week}?season_type=regular`) || [];
  const recs = rows.filter(r => /^\d+$/.test(String(r.player_id)) && r.stats && Object.keys(r.stats).length)
    .map(r => Object.assign({}, r.stats, {player_id: String(r.player_id), game_id: String(r.game_id), date: r.date}))
    .sort((a, b) => a.player_id < b.player_id ? -1 : a.player_id > b.player_id ? 1 : String(a.date) < String(b.date) ? -1 : String(a.date) > String(b.date) ? 1 : 0);
  const line = {};
  liveFantasyPoints(recs, ctx.scoring).forEach(r => { line[`${r.player_id}|${r.game_id}`] = r; });
  const r1 = (x) => rnd(x, 1);
  (ctx.players || []).forEach(p => {
    const gm = out.games[p.game_id]; if (!gm) return;
    const ln = line[`${p.player_id}|${p.game_id}`] || {};
    const soFar = Number(ln.fp) || 0, mins = Number(ln.min) || 0;
    const mean = liveMeanFromQuantiles(p.fp_q.map(q => soFar + gm.left * q), mins > 0 ? 1 : p.p_play);
    out.players[`${p.player_id}|${p.game_id}`] = {so_far: r1(soFar), minutes: r1(mins), left: rnd(gm.left, 2),
      proj_final: r1(gm.final ? soFar : mean), final: gm.final};
  });
  return out;
}

if (typeof module !== "undefined") module.exports = {computeLiveBrowser, liveMeanFromQuantiles, liveFantasyPoints};

// ---- live scores: fast path through the helper (/api/live, no model run), every 90 s while a game is on.
// Patches the live numbers into D and redraws in place (no reload). A game of yours going final triggers a full
// refresh so its lock-or-pass call shows up.
(function () {
  if (!D || D.error || !window.__redrawLive) return;
  const API = "http://127.0.0.1:8766/api/live", IN_PLAY = 4 * 3600e3;
  const rows = () => [...(D.plan || []).flatMap(s => s.steps || []), ...Object.values(D.mode_plans || {}).flatMap(mp => mp.flatMap(s => s.steps || [])),
    ...(D.tonight || []), ...((D.opponent || {}).players || []).map(x => Object.assign(x, {tip_utc: x.tip_utc || x.next_tip}))];
  const onNow = () => rows().some(x => { const dt = Date.now() - new Date(x.tip_utc).getTime(); return x.game_id && dt >= 0 && dt < IN_PLAY && !(x.live && x.live.final); });
  const mine = () => new Set((D.plan || []).flatMap(s => (s.steps || []).map(x => x.player_id + "|" + x.game_id)));
  let wasFinal = new Set(rows().filter(x => x.live && x.live.final).map(x => x.player_id + "|" + x.game_id));
  // the local helper when it's reachable (local page only); otherwise straight from Sleeper + ESPN in this browser
  const viaBrowser = () => computeLiveBrowser(D.live_ctx, async (u) => { const res = await fetch(u, {cache: "no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); }, Date.now());
  const tick = async () => {
    if (!onNow()) return;
    let r = null;
    if (!PUBLIC) { try { r = await (await fetch(API, {cache: "no-store"})).json(); } catch (e) { r = null; } }
    if ((!r || r.error || !r.players) && D.live_ctx) { try { r = await viaBrowser(); } catch (e) { r = null; } }
    if (!r || r.error || !r.players) return;
    let newFinal = false;
    rows().forEach(x => { const k = x.player_id + "|" + x.game_id, v = r.players[k]; if (!v) return;
      x.live = v; if ("mean" in x && !("next_tip" in x)) x.mean = v.proj_final;
      if (v.final && !wasFinal.has(k)) { wasFinal.add(k); if (mine().has(k)) newFinal = true; } });
    D.live_as_of = r.as_of_utc;
    window.__liveMap = Object.assign({}, liveMap(), r.players);
    const el = document.getElementById("liveage"); if (el) el.textContent = `· live ${local(r.as_of_utc)}`;
    try { window.__redrawLive(); } catch (e) { /* keep polling */ }
    if (newFinal && window.__startRefresh) window.__startRefresh(true);
  };
  tick(); setInterval(tick, PUBLIC ? 60000 : 90000);
})();

// published copy: notice a newer publish (version.json, written by scripts/publish_pages.py). Hidden tab -> load it;
// visible -> light up "Reload latest" so the page never jumps while you read.
(function () {
  if (!PUBLIC || !D) return;
  const check = async () => {
    let v; try { v = await (await fetch("version.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) { return; }
    if (!v || !v.generated_utc || !D.generated_utc || Date.parse(v.generated_utc) <= Date.parse(D.generated_utc)) return;
    window.__newVersion = v.generated_utc;
    if (document.hidden) return goLatest(v.generated_utc);
    const b = document.getElementById("reload");
    if (b) { b.textContent = "New data ↻"; b.classList.add("fresh"); b.title = `A newer build was published (${local(v.generated_utc)}). Click to load it.`; }
  };
  window.__checkVersion = check;
  setTimeout(check, 5000); setInterval(check, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
})();

// data age + quiet auto-refresh: only while the page is NOT visible, so it never moves you while reading
const loadedAt = Date.now();
function showAge() {
  const el = document.getElementById("age"); if (!el || !D || !D.generated_utc) return;
  const mins = Math.round((Date.now() - new Date(D.generated_utc).getTime()) / 60000);
  el.textContent = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
}
showAge(); setInterval(showAge, 30000);
setInterval(() => { if (!PUBLIC && document.hidden && Date.now() - loadedAt > 10 * 60000) { saveState(); location.reload(); } }, 60000);
</script>
