*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

details{margin-top:8px} summary{cursor:pointer;color:var(--accent);font-size:13px}

.modebar .seg{margin:0}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--soft)} tr.pick.rec:hover td{background:var(--good-soft)}
.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 14px}

.reloadbtn.fresh{border-color:var(--accent);font-weight:600}
h2.withbtn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.secbar{margin-left:auto;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0;font-weight:400}
.secbtn{font:inherit;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--accent);cursor:pointer;white-space:nowrap}
.secbtn:hover{border-color:var(--accent)} .secbtn:disabled{cursor:default}
.secbtn.running{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)} .secbtn.queued{color:var(--muted);border-style:dashed}
.secbtn.offline{color:var(--muted)}
.asof{font-size:11px;color:var(--muted);white-space:nowrap} .asof.bad{color:var(--bad)}
.modelcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:4px 0 10px;display:grid;gap:7px;font-size:13px}
.modelcard .mrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;color:var(--ink)}
.menu .mi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px;border-radius:8px;align-items:center}
.menu .mi:hover{background:var(--chip)} .menu .mi .d{font-size:12px;color:var(--muted)} .menu .mi .secbtn{grid-row:1/3;grid-column:2}
.lockwatch{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:8px 0 2px;font-size:12px}
.lockchip{font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);cursor:pointer;text-align:left}
.lockchip.off{background:var(--panel);border-style:dashed;color:var(--muted)} .lockchip b{font-weight:650}
.menu .qline{padding:6px 8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:10px}

.strip b{color:var(--ink)} .strip.warn{border-color:var(--warn)} .strip .warntext{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.kpi .x{color:var(--muted);font-size:11.5px;opacity:.85;margin-top:1px}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}

}

  let m = 0, e2 = 0;
  if (mode === "lock") { m = F.mean; e2 = F.var + m * m; }
  else if (mode === "pass") { m = sl.cont_mean; e2 = sl.cont_var + m * m; }
  else F.xs.forEach((x, i) => { const y = x >= bar; m += F.w[i] * (y ? x : sl.cont_mean); e2 += F.w[i] * (y ? x * x : sl.cont_var + sl.cont_mean ** 2); });
  return {mean: m, var: Math.max(0, e2 - m * m),
          chip: near ? {k, side, slot: sl.slot, pid: st.player_id, kind: lv.so_far >= bar ? "ontrack" : "potential", mode, F, bar, pClear, lv} : null};
}
function liveWin(mode) {
  const LW = D.live_win; if (!LW || !LW.modes || !LW.modes[mode] || !LW.opponent) return null;
  const live = liveMap();
  const team = (T, side) => { let m = 0, v = 0; const chips = [];
    T.slots.forEach(sl => { const r = slotLive(sl, live, side); m += r.mean; v += r.var; if (r.chip) chips.push(r.chip); });
    return {m, v, chips}; };
  const me = team(LW.modes[mode], "me"), op = team(LW.opponent, "opp");
  const z = (me.m - op.m) / Math.max(Math.sqrt(me.v + op.v), 1e-6) + (LW.modes[mode].dz || 0);
  const liveNow = Object.values(live).some(v => v && !v.final);
  return {win: normCdf(z), me, op, live: liveNow, sim: LW.modes[mode].win_sim};
}
function lockWatch(r) {
  if (!r) return "";
  const chips = [...r.me.chips, ...r.op.chips];
  if (!chips.length) return r.live ? `<div class="lockwatch"><span class="sub">Live: no player is near his lock bar right now.</span></div>` : "";
  return `<div class="lockwatch"><span class="sub">Live lock watch:</span>${chips.map(c => {
    const on = c.mode === "lock", who_ = c.side === "me" ? "You" : "Opponent";
    const what = c.kind === "ontrack" ? `already ${f1(c.lv.so_far)} ≥ bar ${f1(c.bar)}` : `proj final ${f1(c.F.mean)} vs bar ${f1(c.bar)} · ${Math.round(c.pClear * 100)}% to clear`;
    return `<button class="lockchip${on ? "" : " off"}" data-assume="${esc(c.k)}" title="${on
      ? "Counted as LOCKED at his final in the win chance. Click to assume you pass on him instead (the slot keeps its later games)."
      : "Not counted: the win chance assumes this slot passes on him and keeps its later games. Click to count him as locked."}">🔒 <b>${c.kind === "ontrack" ? "On track to lock" : "Potential lock"}</b> · ${who_}: ${esc(c.slot)} ${esc(nameOf(c.pid))} · ${what} · ${on ? "counting as lock" : "not counting"}</button>`; }).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-assume]"); if (!b) return;
  const k = b.dataset.assume, cur = assumeOf(k, "lock");
  try { localStorage.setItem(assumeKey(k), cur === "lock" ? "pass" : "lock"); } catch (err) { /* not remembered */ }
  if (window.__redrawLive) window.__redrawLive();  // instant: the win chance is computed right here
});

function tokenBanner(t){

  <ol><li>Log in on sleeper.com, open your matchup page, press <b>F12</b> → <b>Network</b>, filter <code>graphql</code>, press F5.</li>

  <li>Paste it as the only content of <code>config\\sleeper_token.txt</code>, then run <code>refresh_dashboard.bat</code>.</li></ol></div>`;
}

  const lockedN = D.plan.filter(s => s.locked).length;

  const cap = (m) => ({winmax: "Win-max", safe: "Safe", balanced: "Balanced", risky: "Risky"})[m] || (m[0].toUpperCase() + m.slice(1));
  const desc = {winmax: `${LS.safer_only ? "Plays for the win, never riskier than balanced: a little safer all week, safer still when you're ahead" : "Plays for the win: safer when you're ahead, riskier when behind"} (re-picked every night)${WM.reason ? ` · now: ${WM.reason}` : ""}`,

  const pct = (x) => (x === null || x === undefined) ? "–" : Math.round(x * 100) + "%";

  // lock-in mode being viewed: the recommended one unless you picked another (remembered in this browser)

  let mode = rec;
  try { const s = localStorage.getItem(MKEY); if (MODES.includes(s)) mode = s; } catch (e) { /* storage blocked: use recommended */ }
  // a mode's week plan (locked slots unchanged) and tonight's bar for one slot under it
  const planFor = (m) => D.plan.map(s => { const mp = ((D.mode_plans || {})[m] || []).find(x => x.index === s.index);
    return s.locked || s.to_lock || !mp ? s : Object.assign({}, s, {expected: mp.expected, steps: mp.steps}); });
  // "if he sits" chain: his slot first, then each slot a fill-in moved out of
  const chainText = (mv) => !mv || !mv.length ? "no change needed" : mv.map((m, k) => `<b>${esc(m.slot)}</b>${k && m.out ? ` <span class="sub">(${esc(m.out.player)} moved over)</span>` : ""} → ${m.in
      ? `${esc(m.in.player)}${m.in.uncertain ? ` <span class="tag bad">${esc(m.in.injury || "uncertain")}</span>` : ""} <span class="sub">(proj ${f1(m.in.mean)}${m.bar != null ? `, lock if ≥ ${f1(m.bar)}` : ", counts automatically"})</span>`

  const barFor = (x, m) => { const mt = x.mode_thresholds && x.mode_thresholds[m];

  if (MODES.length) add(`<div class="modebar"><span class="sub">Lock-in mode</span>
      <div class="seg" id="modeseg">${MODES.map(m => `<button data-m="${m}" title="${esc(desc[m])}">${cap(m)}${m === rec ? " ★" : ""}</button>`).join("")}</div>
      <span class="sub" id="modedesc"></span></div>`);
  add(`<div id="kpibox"></div>`);
  add(`<h2 id="now" class="withbtn">Do this now${secBar("plan")}</h2><div id="nowbox"></div>`);
  add(`<h2 id="lineup" class="withbtn">Tonight's lineup${secBar("plan")}</h2><div id="lineupbox"></div>
      <p class="caption">Starting someone is never worse than leaving a slot empty: you can always pass on his score afterwards.</p>`);
  if (H) add(`<h2 id="matchup" class="withbtn">Matchup vs ${esc(oppName)}${secBar("plan")}</h2><div id="matchbox"></div>`);

  // ---------- opponent's week (doesn't depend on your mode; redrawn when live scores update)

  function drawOpp() {

      <div class="tablewrap"><table class="t"><thead><tr><th>Their players with games left</th><th class="n">Games</th><th>Next</th><th class="n">Avg proj</th><th class="n">Ceiling</th></tr></thead>

  add(`<h2 id="week" class="withbtn">Week plan${secBar("plan")}</h2><p class="intro">Who starts each slot each day, and the score worth locking (the bar falls as the slot's remaining chances run out). Re-planned on every refresh from actual results and the latest injury report.</p>

  const put = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };

  function drawKpis() {

        <span class="tag good">MOVE + LOCK</span>${d.deadline_utc ? `<span class="when">before ${tipTime(d.deadline_utc)}</span>` : ""}</li>`); return; }
      const risky = c.pass_ce != null && Math.abs(c.pass_ce - c.pass_value) >= 0.1;
      const others = MODES.filter(m => m !== mode && d.modes && d.modes[m] && d.modes[m].lock !== c.lock).map(cap);
      const slotTxt = d.move ? `slot ${d.from_slot_index} (${esc(d.from_slot)})` : `slot ${d.slot_index} (${esc(d.slot)})`;

        <div class="note">${txt(r.note)}</div></div><span class="tag acc">LINEUP</span><span class="when">before tip-off</span></li>`));
    (D.tonight||[]).forEach(x => { const b = barFor(x, mode);
      const act = b.other ? `${cap(mode)} mode would use ${esc(b.player)} in this slot instead${b.threshold != null ? ` (lock if ≥ ${f1(b.threshold)})` : ""}`
        : b.threshold != null ? `lock in if he scores <b>≥ ${f1(b.threshold)}</b>, otherwise pass` : "his score counts automatically (last chance for this slot)";
      todo.push(`<li><div>After ${esc(x.player)}'s game: ${act}
        <div class="note">Slot ${x.slot_index} (${esc(x.slot)}) · ${x.live ? (x.live.final ? `final: ${f1(x.live.so_far)} pts in ${Math.round(x.live.minutes)} min (lock call comes with the refresh)` : `live: ${f1(x.live.so_far)} pts in ${Math.round(x.live.minutes)} min, about ${f1(x.mean)} expected at the final`) : `projected ${f1(x.mean)}`}${x.mode_thresholds && b.threshold != null ? ` · ${mode} mode` : ""}</div></div>
        <span class="tag${x.live ? (x.live.final ? " good" : " acc") : ""}">${x.live ? (x.live.final ? "FINAL" : "PLAYING NOW") : "AFTER GAME"}</span><span class="when">${tipTime(x.tip_utc,{hour:"numeric",minute:"2-digit"})} tip</span></li>`); });
    const today = dayKey(new Date().toISOString());
    planFor(mode).forEach(s => (s.steps || []).forEach(x => { if (!x.backup || x.live || dayKey(x.tip_utc) !== today) return;
      const tipT = tipTime(x.tip_utc, {hour: "numeric", minute: "2-digit"});
      todo.push(`<li><div>Check ${who(x.player_id, x.player, true)}${x.injury ? ` <span class="tag bad">${esc(x.injury)}</span>` : ""} before his ${tipT} tip (slot ${s.index}, ${esc(s.slot)})
        <div class="note">If he's ruled out: ${chainText(x.backup)}</div></div><span class="tag warn">CHECK STATUS</span><span class="when">before ${tipT}</span></li>`); }));
    put("nowbox", `<div class="panel">${todo.length ? `<ol class="todo">${todo.join("")}</ol>` : `<p class="empty">Nothing to do right now — re-check after tonight's games.</p>`}</div>`);

  // ---------- TONIGHT'S LINEUP (one row per slot; "A → B" only when the player changes)
  function drawLineup() {
    const tagFor = {swap:["acc","SWAP IN"], keep:["","KEEP"], idle:["warn","NO GAME TONIGHT"], locked:["good","LOCKED"], lock:["warn","LOCK IN APP"], move_lock:["warn","MOVE + LOCK"], playing:["acc","PLAYING NOW"], played:["","PLAYED TODAY"]};
    const noteFor = (r) => { const x = (D.tonight || []).find(t => t.slot_index === r.index), b = x && barFor(x, mode);
      return x && x.threshold != null && b && !b.other && b.threshold != null ? String(r.note || "").replace(`≥ ${f1(x.threshold)}`, `≥ ${f1(b.threshold)}`) : (r.note || ""); };

        : `${cur}<span class="arrow">→</span>${who(tid, r.target, true)}`;
      return `<div class="row ${esc(r.action)}"><div class="slotname">${esc(r.slot)}</div><div class="who2">${pc}</div>
        <div><span class="tag ${tg[0]}">${tg[1]}</span> <span class="note">${txt(noteFor(r))}</span></div></div>`;
    }).join("")}</div>`);
  }

  // ---------- MATCHUP: win chance, both teams' likely finals, the three lock-in modes
  function drawMatchup() {
    if (!H) return;
    const me = Object.assign({name: "You", banked: D.banked}, H.modes[mode]);
    const op = H.opponent ? Object.assign({name: oppName, banked: H.opponent.banked}, H.opponent) : null;
    const lanes = [me].concat(op ? [op] : []);
    const lo = Math.max(0, Math.min(...lanes.map(t => t.banked)) - 10), hi = Math.max(...MODES.map(m => H.modes[m].p90), ...lanes.map(t => t.p90)) + 8;
    const X = (v) => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
    const lane = (t, cls) => `<div class="h2hrow" title="${esc(t.name)}: banked ${f1(t.banked)}, expected ${f1(t.mean)}, 80% range ${f1(t.p10)}–${f1(t.p90)}">
        <div class="h2hname">${esc(t.name)}</div>
        <div class="h2htrack"><span class="bank ${cls}" style="left:0;width:${X(t.banked)}%"></span>
          <span class="rng ${cls}" style="left:${X(t.p10)}%;width:${X(t.p90) - X(t.p10)}%"></span><i style="left:${X(t.mean)}%"></i></div>
        <div class="h2hnum"><b>${f1(t.mean)}</b> <span class="sub">${f1(t.p10)}–${f1(t.p90)}</span></div></div>`;
    const tn = D.tonight || [];
    const modeRow = (m) => { const r = H.modes[m];
      const bars = tn.map(x => { const mt = x.mode_thresholds && x.mode_thresholds[m];
        return mt ? `${esc(mt.player.split(" ").slice(-1)[0])} ${mt.threshold != null ? `≥ ${f1(mt.threshold)}` : "counts"}` : ""; }).filter(Boolean).join(" · ");
      return `<tr data-m="${m}" class="pick${m === mode ? " rec" : ""}"><td><b>${cap(m)}</b> ${m === rec ? '<span class="tag good">RECOMMENDED</span>' : ""}${m === mode ? ' <span class="tag acc">VIEWING</span>' : ""}<div class="note">${desc[m]}</div></td>
        <td class="n"><b>${pct((liveWin(m) || r).win)}</b></td><td class="n">${f1(r.mean)}</td><td class="n">${f1(r.p10)}–${f1(r.p90)}</td>
        <td>${bars || '<span class="note">no lock decisions tonight</span>'}</td></tr>`; };
    put("matchbox", `<div class="panel">
      <div class="h2h">${lane(me, "me")}${op ? lane(op, "op") : ""}</div>
      <p class="caption">Your lane uses ${mode} mode. Solid bar = already banked · light bar = likely final (80% of simulations) · line = expected.</p>
      <div class="subhead">Lock-in style for the rest of the week <span class="sub">(click a row to switch)</span></div>
      <div class="tablewrap"><table class="t"><thead><tr><th>Mode</th><th class="n">Win chance</th><th class="n">Expected</th><th class="n">Likely range</th><th>Tonight's lock bars</th></tr></thead>
      <tbody>${MODES.map(modeRow).join("")}</tbody></table></div>
      <p class="caption">From ${H.n} simulated rest-of-weeks with the same projections for both teams, assuming ${esc(oppName)} plays a sensible balanced plan
        (if they never lock early, your chance in ${cap(mode)} mode is ${pct(H.modes[mode].win_if_never_lock)}). Win-max is simulated with tonight's risk setting held for the rest of the week (live, it's re-picked every night).
        ★ Recommended = the strategy that won the most matchups in the weekly-plan backtest${LS.reason ? `: ${esc(LS.reason)}` : ""}.
        ${H.sim_best && H.sim_best !== rec ? `This week's simulation alone favors ${cap(H.sim_best)} (a single week's simulation is noisy).` : ""}
        ${D.live_win ? "Win chances move with live scores between re-plans (and with the lock choices under the summary above); the full simulation re-runs at every re-plan." : ""}</p></div>`);
  }

  // ---------- WEEK PLAN grid (slots x days) for the viewed mode, with the week so far
  // Finished games stay in their slot (with the score and what happened: locked / passed / lock-or-pass now);
  // "Show full week" adds the earlier days plus Bench and Slot-unclear rows.
  const WKEY = "week-full";
  let weekFull = false;
  try { weekFull = localStorage.getItem(WKEY) === "1"; } catch (e) { /* storage blocked: from today */ }
  const HIST = D.week_history || [];
  const proofTxt = {recorded: "lineup recorded during the game", locked: "Sleeper's lock for this slot",
    inferred: "inferred: no lineup record during the game (PC off?), but your lineup before tip and after the game agree, or the before-lineup was taken just before tip",
    after_only: "inferred from your lineup after the game only (no earlier record this week)",
    unclear: "your lineup changed between the records around this game, so its slot at tip can't be told"};
  const stepCell = (x) => `<div class="cell">${who(x.player_id, x.player, true)}
    <span class="sub">${tipTime(x.tip_utc,{hour:"numeric",minute:"2-digit"})} vs ${esc(x.opponent||"")} · proj ${f1(x.mean)}${x.injury ? ` · <span class="tag bad">${esc(x.injury)}</span>` : ""}${x.p_play < .85 ? ` · <span class="tag bad">${Math.round(x.p_play*100)}%</span>` : ""}</span>
    <span class="thr">${x.threshold != null ? `lock if ≥ <b>${f1(x.threshold)}</b>` : `<span class="tag acc">counts automatically</span>`}</span>${x.live ? `<span class="livebox">${x.live.final
    ? `<span class="tag good">FINAL</span> <b>${f1(x.live.so_far)}</b> pts in ${Math.round(x.live.minutes)} min · lock call comes with the next refresh`
    : `<span class="tag acc">LIVE</span> <b>${f1(x.live.so_far)}</b> pts in ${Math.round(x.live.minutes)} min · about ${f1(x.live.proj_final ?? x.mean)} at the final`} <span class="sub">(as of ${local(D.live_as_of || D.generated_utc)})</span></span>` : ""}${x.backup ? `<span class="bk">If he sits: ${chainText(x.backup)}</span>` : ""}</div>`;
  const histCell = (h) => {
    const d = (D.decisions || []).find(x => x.player_id === h.player_id && (x.slot_index === h.slot_index || x.from_slot_index === h.slot_index));
    const c = d ? ((d.modes || {})[mode] || {lock: d.lock, pass_value: d.open_value, p_below: d.p_below}) : null;
    const unv = (D.unverified || []).find(x => x.slot_index === h.slot_index && x.player_id === h.player_id);
    const tag = h.outcome === "locked" ? `<span class="tag good">🔒 LOCKED</span>`
      : h.outcome === "decide" ? (c ? `<span class="tag ${c.lock ? "good" : "warn"}">${c.lock ? (d.move && mode === (d.mode || "balanced") ? `MOVE + LOCK in ${esc(d.slot)}` : "LOCK IN APP") : "PASS"}</span> <span class="sub">${c.lock ? "recommended" : `recommended · passing: ~${f1(c.pass_value)} expected, ${pct(c.p_below)} chance it ends lower`}</span>`
          : `<span class="tag">CHECK IN APP</span> <span class="sub">${unv ? esc(unv.reason) : "lock or pass before his next game"}</span>`)
      : h.outcome === "passed" ? `<span class="tag">PASSED</span>`
      : h.outcome === "after_lock" ? `<span class="sub">after the lock · doesn't count</span>`
      : h.outcome === "bench" ? `<span class="tag">BENCH</span> <span class="sub">didn't start</span>`
      : `<span class="tag warn">SLOT UNCLEAR</span>${h.candidates && h.candidates.length ? ` <span class="sub">slot ${h.candidates.map(i => esc((D.plan[i - 1] || {}).slot || i)).join(" or ")}</span>` : ""}`;
    const adv = h.advice && h.outcome !== "decide" ? `<span class="sub">advice was: ${h.advice.lock ? "lock" : "pass"}${h.advice.pass_value != null ? ` (${f1(h.advice.pass_value)} if open)` : ""}</span>` : "";
    const inf = h.proof === "inferred" || h.proof === "after_only";
    return `<div class="cell done">${who(h.player_id, h.player, true)}
      <span class="sub">${tipTime(h.tip_utc, {weekday: weekFull ? "short" : undefined, hour: "numeric", minute: "2-digit"})} · <b>${f1(h.score)}</b> pts in ${Math.round(h.minutes || 0)} min</span>
      <span class="thr">${tag}</span>${adv}${inf ? `<span class="sub" title="${esc(proofTxt[h.proof])}">ⓘ ${h.proof === "after_only" ? "slot inferred from your later lineup" : "slot inferred (no record during the game)"}</span>` : ""}</div>`;
  };
  function drawWeek() {
    const plan = planFor(mode), today = dayKey(new Date().toISOString());
    const shown = HIST.filter(h => weekFull || dayKey(h.tip_utc) === today);
    const days = [...new Set([...plan.flatMap(s => s.steps.map(st => dayKey(st.tip_utc))), ...shown.map(h => dayKey(h.tip_utc)),
                              ...(weekFull ? (D.week_days || []) : [])])].sort().filter(k => weekFull || k >= today);
    const hist = (idx, k) => shown.filter(h => h.slot_index === idx && h.outcome !== "unclear" && dayKey(h.tip_utc) === k);
    const head = `<tr><th>Slot</th>${days.map(k => `<th>${dayLabel(k)}${k === today ? ' <span class="tag acc">today</span>' : ""}</th>`).join("")}<th>Expected</th></tr>`;
    const body = plan.map(s => {
      const lockedRow = s.locked || s.to_lock;
      const anyHist = days.some(k => hist(s.index, k).length);
      if (lockedRow && !anyHist) return s.locked
        ? `<tr><td class="slot">${esc(s.slot)}</td><td colspan="${days.length}"><span class="tag good">LOCKED</span> ${esc(s.locked_player)} · <b>${f1(s.locked_score)}</b>${s.lock_source === "manual" ? ' <span class="sub">(your locks.json entry)</span>' : ""}</td><td class="n"><b>${f1(s.locked_score)}</b></td></tr>`
        : `<tr><td class="slot">${esc(s.slot)}</td><td colspan="${days.length}"><span class="tag warn">LOCK IN APP</span> ${esc(s.locked_player)} · <b>${f1(s.locked_score)}</b> <span class="sub">recommended, not locked yet: the plan assumes you lock it</span></td><td class="n"><b>${f1(s.locked_score)}</b></td></tr>`;
      const banked = HIST.find(h => h.slot_index === s.index && (h.outcome === "locked" || (s.to_lock && h.outcome === "decide")));
      const cells = days.map(k => {
        const past = hist(s.index, k).map(histCell).join(""), st = s.steps.filter(x => dayKey(x.tip_utc) === k);
        const after = lockedRow && banked && k > dayKey(banked.tip_utc) && !past;
        return `<td>${past}${st.map(stepCell).join("")}${after ? `<span class="note">${s.locked ? "locked" : "locks when you lock it"}</span>` : ""}</td>`;
      }).join("");
      return `<tr><td class="slot">${esc(s.slot)}</td>${cells}<td class="n"><b>${f1(lockedRow ? s.locked_score : s.expected)}</b></td></tr>`;
    }).join("");
    const extra = (label, pick) => { const rows = shown.filter(pick); if (!weekFull || !rows.length) return "";
      return `<tr><td class="slot">${label}</td>${days.map(k => `<td>${rows.filter(h => dayKey(h.tip_utc) === k).map(histCell).join("")}</td>`).join("")}<td></td></tr>`; };
    const nInf = shown.filter(h => h.proof === "inferred" || h.proof === "after_only").length, nUnc = shown.filter(h => h.outcome === "unclear").length;
    put("weekbox", `<div class="modebar" style="margin:0 0 8px"><button class="secbtn" id="wkfull" onclick="window.__toggleWeek && window.__toggleWeek()">${weekFull ? "Show from today" : "Show full week"}</button>
        ${MODES.length ? `<span class="sub">Showing the <b>${cap(mode)}</b> plan's starts and lock bars${weekFull ? " · earlier days: what you started, locked and passed" : ""}.</span>` : ""}</div>
      <div class="wkgrid"><table><thead>${head}</thead><tbody>${body}${extra("Bench", h => h.outcome === "bench")}${extra("Slot unclear", h => h.outcome === "unclear")}</tbody></table></div>
      ${weekFull && HIST.length ? `<p class="caption">Where each player was at tip comes from lineup records taken during his game; Sleeper's locks are certain.${nInf ? ` ${nInf} game${nInf === 1 ? "" : "s"} had no record during the game (PC off?), so the slot is inferred from your lineup before tip and after the game (ⓘ).` : ""}${nUnc ? ` ${nUnc} couldn't be placed: your lineup changed between the records around them.` : ""}</p>` : ""}`);
  }
  // one handler however often this tab is drawn (re-assigned, never stacked)
  window.__toggleWeek = () => { weekFull = !weekFull;
    try { localStorage.setItem(WKEY, weekFull ? "1" : "0"); } catch (err) { /* not remembered */ } drawWeek(); };

  const drawMode = () => {
    document.querySelectorAll("#modeseg button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
    put("modedesc", MODES.length ? `${esc(desc[mode])}${mode === rec ? " · recommended" : ` · recommended is ${cap(rec)} ★`}` : "");
    drawKpis(); drawNow(); drawLineup(); drawMatchup(); drawWeek(); drawOpp();
  };
  window.__redrawLive = drawMode;  // live-score polling patches D in place, then redraws
  const setMode = (m) => { if (!MODES.includes(m) || m === mode) return; mode = m;
    try { localStorage.setItem(MKEY, m); } catch (e) { /* not remembered; still switches */ }
    drawMode(); };
  app.addEventListener("click", e => { const t = e.target.closest && e.target.closest("#modeseg button[data-m], tr.pick[data-m]"); if (t) setMode(t.dataset.m); });
  drawMode();

  // ---------- PICKUPS
  add(`<h2 id="pickups" class="withbtn">Pickups worth considering${secBar("plan")}</h2>`);
  if (D.moves.length) add(`<div class="tablewrap"><table class="t"><thead><tr><th>Add</th><th>Drop</th><th class="n">Expected gain this week</th></tr></thead><tbody>
      ${D.moves.map(m => `<tr><td>${who(m.add_id, m.add, true)} <span class="sub">${esc(m.positions)}</span></td><td>${who(m.drop_id, m.drop, true)}</td><td class="n"><b>+${f1(m.gain)}</b></td></tr>`).join("")}
      </tbody></table></div>
      <p class="caption">Assumes the player is available now; check waivers (players go on waivers once their game starts).</p>`);
  else add(`<p class="empty">No pickup is worth more than +0.3 expected points this week.</p>`);

  // ---------- PROJECTIONS
  const cols = [["player","Player"],["pos","Pos"],["tip_utc","Next game"],
    ["mean", blended ? "Advice" : "Proj", "n", blended ? "What the advice uses: our model blended with Sleeper" : "Our projection"],
    ...(blended ? [["ours","Ours","n","Our model alone"]] : []), ["sleeper","Sleeper","n","Sleeper's latest projection, your scoring"],
    ["ceiling","Floor – ceiling","","Our 10th–90th percentile range (sorts by ceiling); tick = projection"],
    ["minutes","Min","n"],["p_play","Play %","n"],["games_left","Games left","n"]];
  add(`<h2 id="proj" class="withbtn">Next-game projections${secBar("lines", "projections")}</h2>
    <div class="seg" id="seg"><button data-g="roster" class="on">My roster</button><button data-g="free agent">Free agents</button></div>
    <div class="tablewrap"><table class="t sortable" id="projtable"><thead><tr>
      ${cols.map(([k, t, c, ti]) => `<th data-k="${k}"${c ? ` class="${c}"` : ""}${ti ? ` title="${esc(ti)}"` : ""}>${t}</th>`).join("")}
    </tr></thead><tbody></tbody></table></div><p class="caption" id="outnote"></p>`);
  let group = "roster", sortK = "mean", sortDir = -1;
  const maxC = Math.max(60, ...D.projections.map(p => p.ceiling || 0));
  const drawTable = () => {
    const rows = D.projections.filter(p => p.group === group).sort((a,b) => { const x=a[sortK], y=b[sortK]; return (x>y?1:x<y?-1:0)*sortDir; });
    document.querySelector("#projtable tbody").innerHTML = rows.map(p => `<tr>
      <td>${who(p.player_id, p.player, true)} ${p.injury ? `<span class="tag bad">${esc(p.injury)}</span>` : ""}</td><td>${esc(p.pos)}</td>
      <td>vs ${esc(p.opponent)} <span class="sub">${tipTime(p.tip_utc)}</span>${p.lines === "none" ? ` <span class="tag" title="Betting lines for this game aren't posted yet (or too few). This projection uses the model without lines; refresh closer to tip.">no lines yet</span>` : ""}</td>
      <td class="n"><b>${f1(p.mean)}</b></td>${blended ? `<td class="n">${f1(p.ours ?? p.mean)}</td>` : ""}<td class="n">${p.sleeper == null ? '<span class="note">–</span>' : f1(p.sleeper)}</td>
      <td><div class="rngc"><div class="bar"><span style="left:${p.floor/maxC*100}%;width:${(p.ceiling-p.floor)/maxC*100}%"></span><i style="left:${p.mean/maxC*100}%"></i></div><span class="sub">${f1(p.floor)}–${f1(p.ceiling)}</span></div></td>
      <td class="n">${f1(p.minutes)}</td><td class="n">${Math.round(p.p_play*100)}%</td><td class="n">${p.games_left}</td></tr>`).join("")
      || `<tr><td colspan="${cols.length}" class="empty">No upcoming games this week.</td></tr>`;
    const outs = (D.ruled_out || []).filter(o => o.group === group);
    const lg = rows.filter(p => p.lines != null), ln = lg.filter(p => p.lines !== "none").length;
    const linesNote = D.props && D.props.on ? `Betting lines: on${D.props.verified ? "" : " (unverified pre-tip; points only, not Play %)"} · used for ${ln} of ${lg.length} players shown.` : "";
    document.getElementById("outnote").innerHTML = [outs.length ? `Ruled out, not shown: ${outs.map(o => `${esc(o.player)} <span class="tag bad">${esc(o.injury)}</span>`).join(" · ")}` : "", linesNote].filter(Boolean).join("<br>");
    document.querySelectorAll("#projtable th").forEach(th => { const on = th.dataset.k === sortK; th.classList.toggle("sorted", on); th.classList.toggle("asc", on && sortDir === 1); });
  };
  document.getElementById("seg").addEventListener("click", e => { if (!e.target.dataset.g) return;
    group = e.target.dataset.g; document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b === e.target)); drawTable(); });
  document.querySelectorAll("#projtable th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k; sortDir = (sortK === k) ? -sortDir : -1; sortK = k; drawTable(); }));
  drawTable();

  // ---------- HOW THE MODEL DID (recent games)
  add(`<h2 id="how" class="withbtn">How the model did (recent games)${secBar("recent")}</h2>
    <p class="intro">"Ours" is what the model said <b>before</b> tip-off (live, or for earlier games a model trained only on prior games). "Sleeper" is its last pre-lock projection. All in your scoring.</p>`);
  const R = D.recent || {};
  if (R.error) add(`<p class="empty">Couldn't load: ${esc(R.error)}</p>`);
  if (R.summary && R.summary.length) add(`<div class="tablewrap"><table class="t"><thead><tr><th>Window</th><th>Players</th><th class="n">Games</th>
      <th class="n">Our avg miss</th><th class="n">Sleeper avg miss</th><th class="n" title="Positive = we projected too high">Our bias</th><th class="n">Inside our range (target 80%)</th></tr></thead><tbody>
      ${R.summary.map(s => `<tr><td>${esc(s.window)}</td><td>${esc(s.players)}</td><td class="n">${s.n}</td>
        <td class="n"><b>${f1(s.ours)}</b> ${s.ours < s.sleeper ? '<span class="tag good">better</span>' : s.ours > s.sleeper ? '<span class="tag warn">worse</span>' : ''}</td>
        <td class="n">${f1(s.sleeper)}</td><td class="n">${s.bias > 0 ? "+" : ""}${f1(s.bias)}</td><td class="n">${s.in_range}%</td></tr>`).join("")}
      </tbody></table></div><p class="caption">Small samples swing a lot — judge over weeks. Bias &gt; 0 means we projected too high.</p>`);
  if (R.games && R.games.length) {
    const gr = R.games.map(g => { const miss = g.actual - g.ours; const slMiss = g.sleeper == null ? null : Math.abs(g.actual - g.sleeper);
      const better = slMiss != null && g.played ? (Math.abs(miss) < slMiss ? "good" : Math.abs(miss) > slMiss ? "warn" : "") : "";
      const inr = g.actual >= g.floor && g.actual <= g.ceiling;
      return `<tr><td>${esc((g.date||"").slice(5))}</td><td>${esc(g.player)}</td><td class="n">${f1(g.ours)}</td>
        <td class="n">${f1(g.sleeper)}</td><td class="n"><b>${g.played ? f1(g.actual) : "DNP"}</b></td>
        <td class="n">${g.played && g.ours != null ? `<span class="tag ${better}">${miss > 0 ? "+" : ""}${f1(miss)}</span>` : "–"}</td>
        <td>${g.floor != null ? `<div class="bar" title="floor ${f1(g.floor)} · ceiling ${f1(g.ceiling)}"><span style="left:${g.floor/maxC*100}%;width:${(g.ceiling-g.floor)/maxC*100}%"></span><i style="left:${Math.min(g.actual,maxC)/maxC*100}%;background:${inr?"var(--good)":"var(--bad)"}"></i></div>` : ""}</td>
        <td class="n">${g.played ? f1(g.minutes) : "0"} <span class="sub">(${f1(g.pred_min)})</span></td>
        <td>${esc(g.insight)}${g.source === "live" ? ' <span class="tag acc">live</span>' : ""}</td></tr>`; });
    add(`<div class="subhead">Your players, game by game</div><div class="tablewrap"><table class="t"><thead><tr>
      <th>Date</th><th>Player</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Actual</th>
      <th class="n">Our miss</th><th>Our range</th><th class="n">Min (exp)</th><th>What happened</th></tr></thead><tbody>
      ${moreRows(gr, 14, 9)}</tbody></table></div>
      <p class="caption">Miss tag: green = we were closer than Sleeper, amber = Sleeper was closer. Range bar: our floor–ceiling band; tick = actual (green inside, red outside).</p>`);
  }

  // ---------- PAST WEEKS (season replay)
  const S = D.season_weeks || {};
  add(`<h2 id="season" class="withbtn">This season, week by week${secBar("season")}</h2>
    <p class="intro">Replays each finished week with the roster you actually had, under Lock-In rules: what you banked, what following our plan would have banked, the same plan driven by Sleeper's projections, and the best possible with perfect hindsight.</p>`);
  if (S.error) add(`<p class="empty">Couldn't load: ${esc(S.error)}</p>`);
  else if (S.weeks && S.weeks.length) {
    const vals = S.weeks.flatMap(w => [w.actual, w.ours, w.sleeper, w.best]).filter(v => v != null);
    const lo = Math.min(...vals) * 0.92, hi = Math.max(...vals) * 1.02;
    const series = [["actual", "--actual", "You banked"], ["sleeper", "--sleeper", "Sleeper-driven"], ["ours", "--ours", "Our plan"], ["best", "--best", "Best possible"]];
    const dots = (w) => { const X = v => 7 + 206 * (v - lo) / ((hi - lo) || 1);
      return `<svg class="dots" viewBox="0 0 220 20" role="img" aria-label="Week ${w.week} comparison"><line x1="7" x2="213" y1="10" y2="10" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
        ${series.filter(([k]) => w[k] != null).map(([k, c, n]) => `<circle cx="${X(w[k])}" cy="10" r="5.5" fill="var(${c})" stroke="var(--panel)" stroke-width="1.5"><title>${n}: ${f1(w[k])}</title></circle>`).join("")}</svg>`; };
    const acc = (o, s) => o == null ? '<span class="note">–</span>' : `${o < s ? `<b>${f1(o)}</b>` : f1(o)} <span class="sub">/ ${f1(s)}</span>`;
    add(`<div class="tablewrap"><table class="t"><thead><tr><th>Week</th><th class="n">You banked</th><th class="n">Our plan</th><th class="n">Sleeper-driven</th><th class="n">Best possible</th><th>Compare</th>
      <th class="n" title="The advisor's first estimate of your week total (logging started week 3)">Advisor expected</th>
      <th class="n" title="Average miss per player-game, all NBA players: ours / Sleeper's">Avg miss, all</th><th class="n" title="Average miss per player-game, your players: ours / Sleeper's">Avg miss, yours</th></tr></thead><tbody>
      ${S.weeks.map(w => `<tr><td><b>Week ${w.week}</b> <span class="sub">${esc(w.dates)}</span></td>
        <td class="n">${f1(w.actual)}</td><td class="n"><b>${f1(w.ours)}</b></td><td class="n">${f1(w.sleeper)}</td><td class="n">${f1(w.best)}</td><td>${dots(w)}</td>
        <td class="n">${w.advisor_first ? `${f1(w.advisor_first.expected)} <span class="sub">(${w.advisor_first.locked_n}/7 locked then)</span>` : '<span class="note">–</span>'}</td>
        <td class="n">${acc(w.acc_all_ours, w.acc_all_sleeper)}</td><td class="n">${acc(w.acc_mine_ours, w.acc_mine_sleeper)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="legend" style="margin-top:8px">${series.map(([, c, n]) => `<span><i style="background:var(${c});border-radius:50%"></i>${n}</span>`).join("")}<span>Avg miss columns: ours / Sleeper's (bold = we were closer)</span></div>
      <p class="caption">"Our plan" and "Sleeper-driven" use the same Lock-In strategy and availability information; only the projections differ. Projections for each week come from a model trained only on games before that week. A few weeks is a small sample.</p>`);
  } else add(`<p class="empty">No finished weeks yet.</p>`);

  // ---------- BACKTESTS
  if (D.backtests && D.backtests.length) add(`<details><summary>Long-run backtests vs Sleeper (full past seasons)</summary>
      <div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>Season</th><th class="n">Player-games</th><th class="n">Our avg miss</th><th class="n">Sleeper avg miss</th><th class="n">Difference</th><th>95% CI</th></tr></thead><tbody>
      ${D.backtests.map(b => `<tr><td>${esc(b.season)}</td><td class="n">${esc(b.n)}</td><td class="n">${esc(b.ours)}</td><td class="n">${esc(b.sleeper)}</td><td class="n">${esc(b.diff)}</td><td>${esc(b.ci)}</td></tr>`).join("")}
      </tbody></table></div><p class="caption">Negative difference = we beat Sleeper.</p></details>`);

  add(PUBLIC ? `<footer>Published from the PC after each rebuild (5:00 AM, before each game lock, every ~20 min while games are on) · live scores update in this browser every minute while a game is on · full refresh only on the PC (<code>publish_now.bat</code>).</footer>`
    : `<footer>Refreshes automatically at 5:00 AM and before each game lock; double-click <code>refresh_dashboard.bat</code> any time (e.g. right after you lock someone).
    ${D.health && D.health.last_snapshot_utc ? ` · Last Sleeper snapshot ${local(D.health.last_snapshot_utc)}` : ""}</footer>`);
}
render();
// ===================== "Vs Sleeper" tab =====================
// Inlined into dashboard/index.html by scripts/dashboard.py. Uses globals from the template:
// D (data), $, esc, f1, who, photo, ET, local. Data: D.vs = data/eval/comparison_summary.json.
// Colors are roles (validated palette): --ours blue, --sleeper orange, --best aqua, --actual neutral ink.

const SV = (w, h, inner, label) => `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||"")}">${inner}</svg>`;
const fx = (x, d=3) => (x === null || x === undefined || Number.isNaN(x)) ? "–" : (x > 0 ? "+" : "") + Number(x).toFixed(d);
const pct = (x, d=1) => (x === null || x === undefined) ? "–" : (x * 100).toFixed(d) + "%";
const tip = (t) => `<title>${esc(t)}</title>`;
const LEG = (items) => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:var(${c})"></i>${esc(t)}</span>`).join("")}</div>`;
const SL = (s) => `${s}-${String(+s + 1).slice(2)}`;
// charts in half-width panels use a narrower viewBox (opt.w) so their text stays readable
const HALF = 520;

// horizontal paired bars: rows [{label, a, b, sub}], a = ours, b = Sleeper (lower is better unless higherBetter)
function pairBars(rows, opt) {
  const W = opt.w || 1000, rowH = 44, L = opt.w ? 180 : 210, R = opt.w ? 56 : 120, H = rows.length * rowH + 10;
  const max = Math.max(...rows.flatMap(r => [r.a, r.b]).filter(v => v != null)) * 1.08 || 1;
  const x = v => L + (W - L - R) * (v / max);
  const out = rows.map((r, i) => {
    const y = 6 + i * rowH;
    const best = opt.higherBetter ? (r.a >= r.b ? "a" : "b") : (r.a <= r.b ? "a" : "b");
    return `<text class="lab" x="${L - 10}" y="${y + 16}" text-anchor="end">${esc(r.label)}</text>
      ${r.sub ? `<text x="${L - 10}" y="${y + 31}" text-anchor="end">${esc(r.sub)}</text>` : ""}
      <rect x="${L}" y="${y + 4}" width="${Math.max(2, x(r.a) - L)}" height="14" rx="4" fill="var(--ours)">${tip(`Ours: ${opt.fmt(r.a)}`)}</rect>
      <rect x="${L}" y="${y + 21}" width="${Math.max(2, x(r.b) - L)}" height="14" rx="4" fill="var(--sleeper)">${tip(`Sleeper: ${opt.fmt(r.b)}`)}</rect>
      <text class="lab" x="${x(r.a) + 6}" y="${y + 15}" ${best === "a" ? 'font-weight="700"' : ""}>${opt.fmt(r.a)}</text>
      <text class="lab" x="${x(r.b) + 6}" y="${y + 32}" ${best === "b" ? 'font-weight="700"' : ""}>${opt.fmt(r.b)}</text>`;
  }).join("");
  return SV(W, H, out, opt.label);
}

// diverging dot + CI whisker: rows [{label, sub, diff, lo, hi, clear, n}]; left = we're better.
// opt.w = narrow viewBox for half-width panels; opt.axis === false drops the direction header (shown once by the caller)
function divergingCI(rows, label, opt = {}) {
  const W = opt.w || 1000, rowH = 30, L = opt.w ? 180 : 330, R = opt.w ? 105 : 150;
  const top = opt.axis === false ? 14 : 30, H = rows.length * rowH + top + 10;
  const ext = Math.max(0.05, ...rows.map(r => Math.max(Math.abs(r.lo), Math.abs(r.hi))));
  const x = v => L + (W - L - R) * ((v + ext) / (2 * ext));
  const zero = x(0);
  let s = `<line class="axis" x1="${zero}" x2="${zero}" y1="${top - 12}" y2="${H - 6}"/>` + (opt.axis === false ? "" :
    `<text x="${L}" y="12">◀ we're more accurate</text><text x="${W - R}" y="12" text-anchor="end">Sleeper more accurate ▶</text>`);
  rows.forEach((r, i) => {
    const y = top + i * rowH, col = r.diff < 0 ? "var(--ours)" : "var(--sleeper)";
    s += `<g class="${r.clear ? "" : "mute"}">
      <rect class="hit" x="0" y="${y - 12}" width="${W}" height="${rowH}">${tip(`${r.label} · ${r.sub||""}\ndifference ${fx(r.diff)} (95% CI ${fx(r.lo)} to ${fx(r.hi)}) · n=${(r.n||0).toLocaleString()}${r.clear ? "" : " · not clear yet"}`)}</rect>
      <text class="lab" x="${L - 12}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text>
      <line x1="${x(r.lo)}" x2="${x(r.hi)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/>
      <circle cx="${x(r.diff)}" cy="${y}" r="5" fill="${col}"/>
      <text x="${W - R + 8}" y="${y + 4}">${fx(r.diff)} · n=${(r.n||0).toLocaleString()}</text></g>`;
  });
  return SV(W, H, s, label);
}

// one row per item, ours (blue) and Sleeper (orange) dots around zero: rows [{label, a, b, n}]; closer to 0 is better
function pairDots(rows, opt) {
  const W = opt.w || HALF, rowH = 28, L = 90, R = 190, top = 24, H = rows.length * rowH + top + 2;
  const ext = Math.max(1e-9, ...rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)])) * 1.12;
  const x = v => L + (W - L - R) * ((v + ext) / (2 * ext));
  let s = `<line class="axis" x1="${x(0)}" x2="${x(0)}" y1="${top - 8}" y2="${H - 2}"/>
    <text x="${L}" y="12">◀ ${esc(opt.neg)}</text><text x="${W - R}" y="12" text-anchor="end">${esc(opt.pos)} ▶</text>`;
  rows.forEach((r, i) => {
    const y = top + i * rowH + 8, aBest = Math.abs(r.a) <= Math.abs(r.b);
    s += `<g><rect class="hit" x="0" y="${y - 13}" width="${W}" height="${rowH}">${tip(`${r.label}: ours ${opt.fmt(r.a)} · Sleeper ${opt.fmt(r.b)}${r.n ? ` · n=${r.n.toLocaleString()}` : ""}`)}</rect>
      <text class="lab" x="${L - 12}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text>
      <line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/>
      <circle cx="${x(r.b)}" cy="${y}" r="5.5" fill="var(--sleeper)"/><circle cx="${x(r.a)}" cy="${y}" r="5.5" fill="var(--ours)" stroke="var(--panel)" stroke-width="1.5"/>
      <text x="${W - R + 12}" y="${y + 4}"><tspan ${aBest ? 'font-weight="700"' : ""}>ours ${opt.fmt(r.a)}</tspan> · <tspan ${aBest ? "" : 'font-weight="700"'}>Sleeper ${opt.fmt(r.b)}</tspan></text></g>`;
  });
  return SV(W, H, s, opt.label);
}

// line with CI band: pts [{x(label), y, lo, hi}]
function lineCI(pts, label) {
  const W = 1000, H = 260, L = 56, R = 16, T = 14, B = 34;
  if (!pts.length) return "";
  const ys = pts.flatMap(p => [p.lo, p.hi, p.y]).filter(v => v != null);
  const ext = Math.max(0.1, ...ys.map(Math.abs));
  const X = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = v => T + (H - T - B) * (1 - (v + ext) / (2 * ext));
  const band = pts.map((p, i) => `${X(i)},${Y(p.hi)}`).join(" ") + " " + pts.slice().reverse().map((p, j) => `${X(pts.length - 1 - j)},${Y(p.lo)}`).join(" ");
  const line = pts.map((p, i) => `${X(i)},${Y(p.y)}`).join(" ");
  const ticks = pts.map((p, i) => (i % Math.ceil(pts.length / 10) === 0) ? `<text x="${X(i)}" y="${H - 12}" text-anchor="middle">${esc(p.x)}</text>` : "").join("");
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="${p.y < 0 ? "var(--ours)" : "var(--sleeper)"}">${tip(`${p.x}: ${fx(p.y)} (CI ${fx(p.lo)} to ${fx(p.hi)})`)}</circle>`).join("");
  return SV(W, H, `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>
    <text x="${L - 8}" y="${Y(0) + 4}" text-anchor="end">0</text><text x="${L - 8}" y="${Y(ext * .8) + 4}" text-anchor="end">${fx(ext * .8, 2)}</text>
    <text x="${L - 8}" y="${Y(-ext * .8) + 4}" text-anchor="end">${fx(-ext * .8, 2)}</text>
    <polygon points="${band}" fill="var(--ours)" opacity=".14"/><polyline points="${line}" fill="none" stroke="var(--ours)" stroke-width="2"/>${dots}${ticks}`, label);
}

// multi-line with direct end labels: series [{name, color, vals[]}], labels xs[]
function multiLine(series, xs, label) {
  const W = 1000, H = 210, L = 56, R = 140, T = 14, B = 30;
  const all = series.flatMap(s => s.vals).filter(v => v != null);
  if (!all.length) return "";
  const lo = Math.min(0, ...all), hi = Math.max(...all) * 1.05;
  const X = i => L + (W - L - R) * (xs.length === 1 ? 0.5 : i / (xs.length - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = [0.5, 1].map(f => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(hi * f)}" y2="${Y(hi * f)}"/><text x="${L - 8}" y="${Y(hi * f) + 4}" text-anchor="end">${Math.round(hi * f)}</text>`).join("");
  s += xs.map((x, i) => `<text x="${X(i)}" y="${H - 10}" text-anchor="middle">${esc(x)}</text>`).join("");
  const ends = [];
  series.forEach(se => {
    s += `<polyline points="${se.vals.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(${se.color})" stroke-width="2"/>`;
    s += se.vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(${se.color})">${tip(`${se.name}, ${xs[i]}: ${f1(v)}`)}</circle>`).join("");
    const last = se.vals.length - 1;
    ends.push({y: Y(se.vals[last]) + 4, x: X(last) + 10, t: `${se.name} ${f1(se.vals[last])}`});
  });
  // direct end labels, nudged apart so they never overlap (min 15px)
  ends.sort((a, b) => a.y - b.y).forEach((e, i, arr) => { if (i && e.y - arr[i - 1].y < 15) e.y = arr[i - 1].y + 15; });
  s += ends.map(e => `<text class="lab" x="${e.x}" y="${e.y}">${esc(e.t)}</text>`).join("");
  return SV(W, H, s, label);
}

// calibration: projected (x) vs actual (y) per decile for both sources + diagonal
function calibration(rows) {
  const W = 1000, H = 330, L = 60, R = 20, T = 14, B = 40;
  const vals = rows.flatMap(r => [r.proj, r.actual]);
  const mx = Math.max(...vals) * 1.05;
  const X = v => L + (W - L - R) * (v / mx), Y = v => T + (H - T - B) * (1 - v / mx);
  let s = `<line class="grid" x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx)}" stroke-dasharray="4 4"/>
    <text x="${X(mx * .78)}" y="${Y(mx * .82)}">perfect calibration</text>
    <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">projected fantasy points (decile average)</text>
    <text x="14" y="${(T + H - B) / 2}" transform="rotate(-90 14 ${(T + H - B) / 2})" text-anchor="middle">actual average</text>`;
  [["ours", "--ours"], ["sleeper", "--sleeper"]].forEach(([src, c]) => {
    const r = rows.filter(x => x.source === src);
    s += `<polyline points="${r.map(p => `${X(p.proj)},${Y(p.actual)}`).join(" ")}" fill="none" stroke="var(${c})" stroke-width="2"/>`;
    s += r.map(p => `<circle cx="${X(p.proj)}" cy="${Y(p.actual)}" r="5" fill="var(${c})" stroke="var(--panel)" stroke-width="2">${tip(`${src === "ours" ? "Ours" : "Sleeper"}: projected ${f1(p.proj)} → actual ${f1(p.actual)} (n=${p.n})`)}</circle>`).join("");
  });
  return SV(W, H, s, "Calibration");
}

// plan ranges per week: our / Sleeper pre-week p10-p90 bars + realized marks + you + best/worst
function planRanges(weeks) {
  const W = 1000, rowH = 92, L = 120, R = 30, H = weeks.length * rowH + 30;
  const all = weeks.flatMap(w => [w.best, w.worst, w.ours_dist.p90, w.sleeper_dist.p90, w.actual].filter(v => v != null));
  const mx = Math.max(...all) * 1.04, mn = Math.min(...all) * 0.95;
  const X = v => L + (W - L - R) * ((v - mn) / (mx - mn));
  let s = "";
  weeks.forEach((w, i) => {
    const y = 20 + i * rowH;
    s += `<text class="lab" x="${L - 12}" y="${y + 30}" text-anchor="end" font-weight="700">Week ${w.week}</text><text x="${L - 12}" y="${y + 46}" text-anchor="end">${esc(w.dates)}</text>
      <line x1="${X(w.worst)}" x2="${X(w.best)}" y1="${y + 78}" y2="${y + 78}" stroke="var(--line)" stroke-width="6" stroke-linecap="round">${tip(`Range of outcomes with your roster: worst ${f1(w.worst)} → best possible ${f1(w.best)}`)}</line>
      <text x="${X(w.worst)}" y="${y + 92}" text-anchor="middle">worst ${f1(w.worst)}</text>
      <circle cx="${X(w.best)}" cy="${y + 78}" r="6" fill="var(--best)">${tip(`Best possible (hindsight): ${f1(w.best)}`)}</circle>
      <text class="lab" x="${X(w.best)}" y="${y + 66}" text-anchor="middle">best ${f1(w.best)}</text>`;
    [["ours_dist", "ours", "--ours", "Our plan", 6], ["sleeper_dist", "sleeper", "--sleeper", "Sleeper plan", 30]].forEach(([dk, rk, c, nm, dy]) => {
      const d = w[dk];
      s += `<rect x="${X(d.p10)}" y="${y + dy}" width="${Math.max(2, X(d.p90) - X(d.p10))}" height="14" rx="4" fill="var(${c})" opacity=".25">${tip(`${nm}: expected before the week ${f1(d.p10)}–${f1(d.p90)} (median ${f1(d.p50)})`)}</rect>
        <line x1="${X(d.p50)}" x2="${X(d.p50)}" y1="${y + dy}" y2="${y + dy + 14}" stroke="var(${c})" stroke-width="2"/>
        <circle cx="${X(w[rk])}" cy="${y + dy + 7}" r="7" fill="var(${c})" stroke="var(--panel)" stroke-width="2">${tip(`${nm} actually banked ${f1(w[rk])}`)}</circle>
        <text class="lab" x="${X(w[rk]) + 12}" y="${y + dy + 11}">${nm} ${f1(w[rk])}</text>`;
    });
    if (w.actual != null) s += `<path d="M${X(w.actual)} ${y + 52} l7 10 h-14z" fill="var(--actual)">${tip(`You actually banked ${f1(w.actual)}`)}</path>
      <text class="lab" x="${X(w.actual) + 10}" y="${y + 62}">you ${f1(w.actual)}</text>`;
  });
  return SV(W, H, s, "Plans head-to-head");
}

const CLEAR = (c) => c ? "" : ' <span class="tag">not clear yet</span>';

function renderVs() {
  const V = D.vs, root = document.getElementById("vs");
  if (!V) { root.innerHTML = `<p class="empty">No comparison data yet. Run <code>scripts\\compare_report.py</code>.</p>`; return; }
  const addV = (h) => root.append($(h));
  addV(`<header><div><h1>Our projections vs Sleeper's</h1><div class="sub">Your scoring · fair comparison: player played, both projected, not ruled out at lock · updated ${local(V.generated_utc)}</div></div></header>
    ${LEG([["--ours", "Our model"], ["--sleeper", "Sleeper"], ["--best", "Best possible (hindsight)"], ["--actual", "You / actual"]])}
    <nav><a href="#vs-take">Takeaways</a><a href="#vs-plans">Plans head-to-head</a><a href="#vs-verdict">Verdict</a><a href="#vs-seg">Where better/worse</a><a href="#vs-stats">Per stat</a><a href="#vs-decide">Start/sit</a><a href="#vs-time">Over time</a><a href="#vs-players">Players</a><a href="#vs-macro">Totals</a><a href="#vs-versions">Versions</a></nav>`);

  // ---- takeaways
  addV(`<h2 id="vs-take">Key takeaways</h2><ul class="takeaways">${(V.takeaways || []).map(t => `<li class="${t.tone}">${esc(t.text)} <a href="#vs-${t.section === "plans" ? "plans" : t.section === "verdict" ? "verdict" : t.section === "segments" ? "seg" : t.section === "decisions" ? "decide" : "stats"}">details</a></li>`).join("")}</ul>`);

  // ---- plans head-to-head (independent of filters)
  const P = (V.plans || {}).weeks || [];
  addV(`<h2 id="vs-plans">Plans head-to-head: ours vs Sleeper's vs yours</h2>
    <p class="sub" style="margin-top:-4px">Your actual roster each finished week, under Lock-In rules. Both plans use the same strategy and the same injury/availability information; only the projections differ.</p>`);
  if (P.length) {
    const tot = P[P.length - 1].cumulative;
    addV(`<div class="vrow">
      <div class="kpi"><div class="v">${f1(tot.ours / P.length)}</div><div class="l">Our plan, pts/week</div></div>
      <div class="kpi"><div class="v">${f1(tot.sleeper / P.length)}</div><div class="l">Sleeper plan, pts/week</div></div>
      <div class="kpi"><div class="v">${f1(tot.actual / P.length)}</div><div class="l">You banked, pts/week</div></div>
      <div class="kpi"><div class="v">${f1(tot.best / P.length)}</div><div class="l">Best possible, pts/week</div></div></div>
      <div class="panel" style="margin-top:10px">${planRanges(P)}
      <p class="caption">Shaded bars: what each plan expected before the week (p10–p90, line = median). Dots: what each plan would actually have banked. ▲ what you banked. Gray track: worst → best possible with your roster.</p></div>
      <div class="panel" style="margin-top:10px">${multiLine([{name:"Best", color:"--best", vals:P.map(w=>w.cumulative.best)}, {name:"Our plan", color:"--ours", vals:P.map(w=>w.cumulative.ours)}, {name:"Sleeper plan", color:"--sleeper", vals:P.map(w=>w.cumulative.sleeper)}, {name:"You", color:"--actual", vals:P.map(w=>w.cumulative.actual)}], P.map(w=>"Wk " + w.week), "Cumulative banked points")}
      <p class="caption">Season-to-date banked points under each approach.</p></div>
      <details><summary>Slot-by-slot: who each plan locked, every week</summary>${P.map(w => `<div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>Week ${w.week} slot</th><th>Our plan locked</th><th class="n">pts</th><th class="n">starts</th><th>Sleeper plan locked</th><th class="n">pts</th><th class="n">starts</th></tr></thead><tbody>
        ${w.slots.map(s => `<tr><td>${esc(s.slot)}</td><td>${esc(s.ours_player || "—")}</td><td class="n"><b>${f1(s.ours_score)}</b></td><td class="n">${s.ours_starts}</td><td>${esc(s.sleeper_player || "—")}</td><td class="n"><b>${f1(s.sleeper_score)}</b></td><td class="n">${s.sleeper_starts}</td></tr>`).join("")}</tbody></table></div>`).join("")}</details>`);
  } else addV(`<p class="empty">No finished weeks yet this season.</p>`);
  const LS = (V.league_sim || {}).seasons || [];
  // targets: the "10% better" goal measured where it wins matchups
  const gc = LS.filter(s => s.gap_capture != null);
  if (gc.length) {
    const pooled = gc.reduce((a, s) => a + (s.ours - s.sleeper) * s.team_weeks, 0) / gc.reduce((a, s) => a + (s.best - s.sleeper) * s.team_weeks, 0);
    const hv = (V.views["all|all|incl"] || {}).headline || {}, rk = (V.views["all|all|incl"] || {}).ranking || {};
    const cell = (ok, txt, lab, sub) => `<div class="kpi"><div class="v">${txt} <span class="tag ${ok ? "good" : "warn"}">${ok ? "on target" : "not yet"}</span></div><div class="l">${lab}</div><div class="x">${sub}</div></div>`;
    addV(`<h2>Targets</h2><div class="vrow">
      ${cell(pooled >= 0.10, (pooled * 100).toFixed(1) + "%", "Lock-In gap capture · target ≥ 10%", "Share of the points Sleeper's plan leaves vs. hindsight best that ours wins back")}
      ${cell(rk.pair_acc_ours > rk.pair_acc_sleeper, pct(rk.pair_acc_ours), "Start/sit ranking · target: above Sleeper", `Sleeper ${pct(rk.pair_acc_sleeper)}`)}
      ${cell(hv.diff < 0 && hv.clear, fx(hv.diff), "Avg miss vs Sleeper · target: clearly below 0", "Ours minus Sleeper's, fantasy pts per player-game")}</div>
      <p class="caption">A 10% lower average miss isn't reachable: even a predictor that peeks at each player's surrounding games misses by more than Sleeper does. Single games are mostly noise. Gap capture measures "10% better" where it wins matchups.</p>`);
  }
  if (LS.length) addV(`<div class="panel" style="margin-top:10px"><b>League-wide check</b> <span class="sub">14 synthetic snake-drafted teams, every week, same strategy</span>
    ${pairBars(LS.map(s => ({label: `${s.season}-${String(s.season + 1).slice(2)}`, sub: `${s.team_weeks} team-weeks · diff ${fx(s.diff, 2)} [${fx(s.ci[0], 2)}, ${fx(s.ci[1], 2)}]`, a: s.ours, b: s.sleeper})), {fmt: v => f1(v), higherBetter: true, label: "League simulation"})}
    ${LS.some(s => s.ours_emp != null) ? `<b style="display:block;margin-top:10px">Apples-to-apples: same range method for both</b>
      ${pairBars(LS.filter(s => s.ours_emp != null).map(s => ({label: `${s.season}-${String(s.season + 1).slice(2)}`, sub: `diff ${fx(s.diff_emp, 2)} [${fx(s.ci_emp[0], 2)}, ${fx(s.ci_emp[1], 2)}]`, a: s.ours_emp, b: s.sleeper})), {fmt: v => f1(v), higherBetter: true, label: "League simulation, same range method"})}
      <p class="caption">Here our projections get exactly the same kind of outcome range as Sleeper's (spread learned from the previous season's misses), so only the projections differ. The first chart uses our model's own range, which is currently too narrow (it catches 75% of outcomes instead of 80%), so our plan locks too early.</p>` : ""}
    <p class="caption">Average points banked per team-week (higher is better). Bold = the better plan. Ours wins / ties: ${LS.map(s => `${pct(s.ours_win_rate, 0)} / ${pct(s.tie_rate || 0, 0)}`).join(" · ")}.</p></div>`);

  // ---- filters + view-dependent sections
  const seasons = ["all", ...(V.seasons || []).map(String), "live"];
  const sLabel = s => s === "all" ? "All seasons" : s === "live" ? "Live forward test" : `${s}-${String(+s + 1).slice(2)}${+s === Math.max(...V.seasons) ? " (this season)" : ""}`;
  addV(`<div class="filters" id="vs-filters">
    <label>Season <select id="f-season">${seasons.map(s => `<option value="${s}">${sLabel(s)}</option>`).join("")}</select></label>

    <label>Left-early games <select id="f-le"><option value="incl">Included</option><option value="excl">Excluded</option></select></label>
    <span class="sub" id="f-n"></span></div><div id="vs-view"></div>`);
  const draw = () => {
    const key = `${document.getElementById("f-season").value}|${document.getElementById("f-who").value}|${document.getElementById("f-le").value}`;
    const v = V.views[key] || {headline: {n: 0}}, box = document.getElementById("vs-view");
    box.innerHTML = "";
    const A = (h) => box.append($(h));
    const h = v.headline || {};
    document.getElementById("f-n").textContent = h.n ? `${h.n.toLocaleString()} player-games · ${h.days} game days` : "";
    if (!h.n) { A(`<p class="empty">Not enough data for this selection yet.</p>`); return; }

    // verdict
    const good = h.diff < 0;
    A(`<h2 id="vs-verdict">Verdict</h2><div class="panel"><div class="big" style="margin-bottom:8px">${good ? "We're more accurate" : "Sleeper is more accurate"} by <b>${Math.abs(h.diff).toFixed(3)}</b> fantasy pts per player-game
      <span class="sub">(95% CI ${fx(h.ci[0])} to ${fx(h.ci[1])})</span>${h.clear ? ` <span class="tag ${good ? "good" : "warn"}">statistically clear</span>` : CLEAR(false)}</div>
      ${pairBars([{label: "Avg miss (MAE)", a: h.mae_ours, b: h.mae_sleeper}, {label: "Root-mean-square miss", a: h.rmse_ours, b: h.rmse_sleeper}, {label: "Median miss", a: h.medae_ours, b: h.medae_sleeper}], {fmt: v => v.toFixed(3), label: "Accuracy"})}
      <div class="vrow" style="margin-top:8px">
        <div class="kpi"><div class="v">${pct(h.win_rate)}</div><div class="l">Games where we were closer</div></div>
        <div class="kpi"><div class="v">${pct(h.big_miss_ours)} <span class="sub">vs ${pct(h.big_miss_sleeper)}</span></div><div class="l">Big misses (off by 10+)</div></div>
        <div class="kpi"><div class="v">${fx(h.bias_ours, 2)} <span class="sub">vs ${fx(h.bias_sleeper, 2)}</span></div><div class="l">Bias (+ = projected too high)</div></div></div>
      <p class="caption">Lower bars are better. Bold value = the more accurate source.</p></div>`);

    // by season (only in "all" season view)
    if (document.getElementById("f-season").value === "all") {
      const who = document.getElementById("f-who").value, le = document.getElementById("f-le").value;
      const rows = (V.seasons || []).map(s => ({s, h: (V.views[`${s}|${who}|${le}`] || {}).headline})).filter(r => r.h && r.h.n);
      A(`<h2>By season</h2><div class="panel">${divergingCI(rows.map(r => ({label: sLabel(String(r.s)), diff: r.h.diff, lo: r.h.ci[0], hi: r.h.ci[1], clear: r.h.clear, n: r.h.n})), "By season")}
        <p class="caption">Dot = our average miss minus Sleeper's; line = 95% CI. Left of zero = we're better. Faded = not statistically clear.</p></div>`);
    }

    // segments
    const segs = v.segments || [];
    if (segs.length) {
      const groups = [...new Set(segs.map(s => s.group))];
      const pre = segs.filter(s => !s.diagnostic && !/unknown|no line|no report|no history/.test(s.segment));
      const top = pre.filter(s => s.clear && s.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);
      const weak = pre.filter(s => s.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
      A(`<h2 id="vs-seg">Where we're better and where we're worse</h2>
        <div class="twocol"><div class="panel"><b>Biggest edges</b><ol style="margin:6px 0 0 18px;padding:0">${top.map(s => `<li><span class="tag standout">standout</span> ${esc(s.group)}: <b>${esc(s.segment)}</b> ${fx(s.diff)} <span class="sub">n=${s.n.toLocaleString()}</span></li>`).join("") || "<li class='empty'>none clear yet</li>"}</ol></div>
        <div class="panel"><b>Weak spots</b><ol style="margin:6px 0 0 18px;padding:0">${weak.map(s => `<li>${esc(s.group)}: <b>${esc(s.segment)}</b> ${fx(s.diff)}${CLEAR(s.clear)} <span class="sub">n=${s.n.toLocaleString()}</span></li>`).join("") || "<li class='empty'>no segment where Sleeper is better</li>"}</ol></div></div>
        <div class="panel" style="margin-top:10px"><p class="caption" style="margin:0">Each row: our average miss minus Sleeper's for that kind of game, with 95% CI.
          <b>◀ Left of the line = we're more accurate</b>, right = Sleeper. Faded rows aren't statistically clear yet. Hover a row for exact numbers.</p>
          <div class="seggrid">${groups.map(g => `<div><b>${esc(g)}</b>${segs.find(s => s.group === g).diagnostic ? ' <span class="tag">post-game diagnostic</span>' : ""}
          ${divergingCI(segs.filter(s => s.group === g).sort((a, b) => a.diff - b.diff).map(s => ({label: s.segment, diff: s.diff, lo: s.ci[0], hi: s.ci[1], clear: s.clear, n: s.n})), g, {w: HALF, axis: false})}</div>`).join("")}</div></div>`);
    }

    // per stat
    const ps = v.per_stat || [];
    if (ps.length) A(`<h2 id="vs-stats">Per stat</h2><div class="twocol">
      <div class="panel"><b>Average miss per stat</b>${pairBars(ps.map(s => ({label: s.stat.toUpperCase(), sub: `weight ${s.weight}`, a: s.mae_ours, b: s.mae_sleeper})), {fmt: v => v.toFixed(2), label: "Per-stat MAE", w: HALF})}<p class="caption">Lower is better (in the stat's own units).</p></div>
      <div class="panel"><b>Bias in your fantasy points</b>${pairDots(ps.map(s => ({label: s.stat.toUpperCase(), a: s.fp_bias_ours, b: s.fp_bias_sleeper, n: h.n})), {fmt: v => fx(v), neg: "projected too low", pos: "too high", label: "Bias"})}
      <p class="caption">Average over (+) or under (−) projection of each stat, converted to fantasy points with your scoring. Closer to 0 is better; bold = closer.</p></div></div>`);

    // minutes
    const mn = v.minutes || {};
    if (mn.min_mae_ours != null) A(`<h2>Minutes vs production</h2><div class="panel">${pairBars([{label: "Minutes miss", sub: "avg minutes off", a: mn.min_mae_ours, b: mn.min_mae_sleeper}, {label: "Fantasy miss", sub: "as projected", a: mn.fp_mae_ours, b: mn.fp_mae_sleeper}, {label: "…if minutes were known", sub: "same per-minute rate", a: mn.fp_mae_if_true_min_ours, b: mn.fp_mae_if_true_min_sleeper}], {fmt: v => v.toFixed(2), label: "Minutes"})}
      <p class="caption">Minutes explain about ${pct(mn.share_from_minutes_ours, 0)} of our fantasy-point miss and ${pct(mn.share_from_minutes_sleeper, 0)} of Sleeper's. Minutes bias: ours ${fx(mn.min_bias_ours, 2)} min, Sleeper ${fx(mn.min_bias_sleeper, 2)} min.</p></div>`);

    // calibration + coverage
    if ((v.calibration || []).length) A(`<h2>Calibration</h2><div class="panel">${calibration(v.calibration)}
      <p class="caption">For each tenth of projections, the average projection (x) vs what actually happened (y). On the dashed line = unbiased at that level. ${v.coverage && v.coverage.inside_p10_p90 != null ? `Our floor–ceiling range contained ${pct(v.coverage.inside_p10_p90)} of results (target 80%; below floor ${pct(v.coverage.below_floor)}, above ceiling ${pct(v.coverage.above_ceiling)}).` : ""}</p></div>`);

    // decisions
    const rk = v.ranking || {}, dg = v.disagreements || {};
    if (rk.pairs || (dg.buckets || []).length) A(`<h2 id="vs-decide">Start/sit decisions</h2><div class="twocol">
      ${rk.pairs ? `<div class="panel"><b>Ranking similar players</b>${pairBars([{label: "Picks the better of two", sub: "players within 5 pts", a: rk.pair_acc_ours, b: rk.pair_acc_sleeper}, {label: "Daily rank correlation", sub: "Spearman", a: rk.spearman_ours, b: rk.spearman_sleeper}], {fmt: v => (v * 100).toFixed(1) + (v < 1 ? "%" : ""), higherBetter: true, label: "Ranking", w: HALF})}
        <p class="caption">Higher is better. ${rk.pairs.toLocaleString()} close player pairs over ${rk.days} game days. This is what decides start/sit and lock calls.</p></div>` : ""}
      ${(dg.buckets || []).length ? `<div class="panel"><b>When we disagree with Sleeper</b>${pairBars(dg.buckets.map(b => ({label: b.bucket + " apart", sub: `n=${b.n.toLocaleString()} · we're closer ${pct(b.we_closer)}`, a: b.mae_ours, b: b.mae_sleeper})), {fmt: v => v.toFixed(2), label: "Disagreements", w: HALF})}
        <p class="caption">Average miss when the two projections differ by that much. Lower is better.</p></div>` : ""}</div>
      ${(dg.recent_biggest || []).length ? `<div class="subhead">Biggest recent disagreements — who was right</div><div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Player</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Actual</th><th>Closer</th></tr></thead><tbody>
        ${moreRows(dg.recent_biggest.map(r => `<tr><td>${esc(r.date.slice(5))}</td><td>${who(r.player_id, r.player, true)}</td><td class="n">${f1(r.ours)}</td><td class="n">${f1(r.sleeper)}</td><td class="n"><b>${f1(r.actual)}</b></td><td><span class="tag ${r.winner === "ours" ? "good" : "warn"}">${r.winner === "ours" ? "ours" : "Sleeper"}</span></td></tr>`), 8, 6)}</tbody></table></div>` : ""}`);

    // over time
    const ot = v.over_time || [];
    if (ot.length > 1) A(`<h2 id="vs-time">Over time</h2><div class="panel">${lineCI(ot.map(o => ({x: `${String(o.season).slice(2)} w${o.week}`, y: o.diff, lo: o.ci[0], hi: o.ci[1]})), "Weekly difference")}
      <p class="caption">Weekly average miss, ours minus Sleeper's (below 0 = we were better that week), with 95% CI band.</p></div>`);

    // players & teams
    const pl = v.players || {}, tm = v.teams || {};
    if ((pl.best || []).length) {
      const tbl = (rows, title) => `<div class="panel"><b>${title}</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th>Player</th><th class="n">Games</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Diff</th></tr></thead><tbody>
        ${rows.slice(0, 12).map(r => `<tr><td>${who(r.id, r.label, true)}</td><td class="n">${r.n}</td><td class="n">${r.mae_ours.toFixed(2)}</td><td class="n">${r.mae_sleeper.toFixed(2)}</td><td class="n"><span class="tag ${r.diff < 0 ? "good" : "warn"}">${fx(r.diff, 2)}</span></td></tr>`).join("")}</tbody></table></div></div>`;
      A(`<h2 id="vs-players">Players we read better / worse</h2><div class="twocol">${tbl(pl.best, "We're better on")}${tbl(pl.worst, "Sleeper is better on")}</div>

    }
    if ((tm.best || []).length) A(`<details><summary>By NBA team</summary><div class="panel" style="margin-top:8px">${divergingCI(tm.best.map(t => ({label: t.label, diff: t.diff, lo: t.diff, hi: t.diff, clear: true, n: t.n})), "Teams")}<p class="caption">Our average miss minus Sleeper's for each team's players.</p></div></details>`);

    // macro
    const M = v.macro || {};
    if ((M.league_by_season || []).length) {
      const st = M.stat_totals || [], tg = M.team_game || {}, lt = M.leaders_top50 || [];
      A(`<h2 id="vs-macro">Combined totals (macro)</h2><div class="twocol">
        <div class="panel"><b>Total fantasy points: projected vs actual</b>${pairDots(M.league_by_season.map(s => ({label: SL(s.season), a: s.ours_pct, b: s.sleeper_pct, n: s.n})), {fmt: v => fx(v, 1) + "%", neg: "too low", pos: "too high", label: "League totals"})}
          <p class="caption">How far each source's season total was from the real total. Closer to 0 is better; bold = closer.</p></div>
        <div class="panel"><b>Per-stat league totals</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th>Stat</th><th class="n">Actual</th><th class="n">Ours off by</th><th class="n">Sleeper off by</th></tr></thead><tbody>
          ${st.map(s => `<tr><td>${s.stat.toUpperCase()}</td><td class="n">${Math.round(s.actual).toLocaleString()}</td><td class="n">${fx(s.ours_pct, 1)}%</td><td class="n">${fx(s.sleeper_pct, 1)}%</td></tr>`).join("")}</tbody></table></div></div></div>
        <div class="twocol" style="margin-top:10px"><div class="vrow" style="align-content:start">
          <div class="kpi"><div class="v">${f1(tg.mae_ours)} <span class="sub">vs ${f1(tg.mae_sleeper)}</span></div><div class="l">Team-game total miss</div><div class="x">Sum of a team's players: ours vs Sleeper</div></div>
          <div class="kpi"><div class="v">${fx(tg.bias_ours, 1)} <span class="sub">vs ${fx(tg.bias_sleeper, 1)}</span></div><div class="l">Team-game total bias</div><div class="x">+ = projected too high</div></div></div>
          ${lt.length ? `<div class="panel"><b>Top-50 scorers caught</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th></th>${lt.map(l => `<th class="n">${SL(l.season)}</th>`).join("")}</tr></thead><tbody>
            <tr><td>Ours</td>${lt.map(l => `<td class="n">${l.overlap_ours > l.overlap_sleeper ? `<b>${l.overlap_ours}</b>` : l.overlap_ours}</td>`).join("")}</tr>
            <tr><td>Sleeper</td>${lt.map(l => `<td class="n">${l.overlap_sleeper > l.overlap_ours ? `<b>${l.overlap_sleeper}</b>` : l.overlap_sleeper}</td>`).join("")}</tr></tbody></table></div>
            <p class="caption">Of each season's real top-50 scorers, how many each source also had in its own top 50.</p></div>` : ""}</div>`);
    }
  };
  ["f-season", "f-who", "f-le"].forEach(id => document.getElementById(id).addEventListener("change", draw));
  draw();

  // ---- live + versions (independent)
  const lv = (V.views["live|all|incl"] || {}).headline || {};
  addV(`<h2>Live forward test</h2><div class="panel">${lv.n ? `Our live pre-lock projections vs Sleeper's pre-lock snapshots: <b>${lv.mae_ours.toFixed(3)}</b> vs <b>${lv.mae_sleeper.toFixed(3)}</b> over ${lv.n} player-games${CLEAR(lv.clear)}` : `<span class="empty">Fills in as live games finish (started 2026-11-06). Select “Live forward test” above for full detail once there's data.</span>`}</div>`);
  const VV = V.versions || [];
  if (VV.length) addV(`<h2 id="vs-versions">Model versions</h2><div class="tablewrap"><table class="t"><thead><tr><th>Season</th><th>Version</th><th class="n">Player-games</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Diff</th><th>95% CI</th></tr></thead><tbody>
    ${VV.sort((a, b) => a.season - b.season || String(a.version).localeCompare(String(b.version))).map(r => `<tr><td>${r.season}-${String(r.season + 1).slice(2)}</td><td>${esc(r.version)}</td><td class="n">${r.n.toLocaleString()}</td><td class="n">${r.ours.toFixed(3)}</td><td class="n">${r.sleeper.toFixed(3)}</td><td class="n">${fx(r.diff)}</td><td>${esc(r.ci)}</td></tr>`).join("")}</tbody></table></div>
    <p class="caption">Each model version's full-season backtest. "props (provisional)" isn't used live until the props check passes.</p>`);

  // ---- ADVISOR BLEND: separate from everything above (never counted as the model beating Sleeper)
  const AD = V.advisor || {};
  if (AD.headline && AD.headline.n) {
    const ah = AD.headline, mh = AD.model_headline || {}, ar = AD.ranking || {}, AL = AD.league || null;
    const sl = (s) => `${s}-${String(s + 1).slice(2)}`;
    const LSb = ((V.league_sim || {}).seasons || []).filter(r => r.diff_blend != null);
    addV(`<h2 id="vs-advisor">Advisor (blend): not counted as model vs Sleeper</h2>
      <div class="banner info" style="margin-bottom:10px"><b>What this is</b>Lineup advice may blend our model with Sleeper's live projection (you approved this 2026-11-06).
        Everything above is the model alone, which never sees Sleeper. Each season's blend weight is fitted on earlier seasons only, so these are honest out-of-sample results.</div>
      <div class="vrow">
        <div class="kpi"><div class="v">${(ah.mae_ours).toFixed(3)} <span class="sub">vs ${(ah.mae_sleeper).toFixed(3)}</span></div><div class="l">Blend vs Sleeper avg miss${CLEAR(ah.clear)}</div><div class="x">${fx((ah.mae_ours / ah.mae_sleeper - 1) * 100, 1)}% · CI ${fx(ah.ci[0])} to ${fx(ah.ci[1])}</div></div>
        <div class="kpi"><div class="v">${mh.mae_ours != null ? mh.mae_ours.toFixed(3) : "–"}</div><div class="l">Model alone, same games</div><div class="x">${ah.n.toLocaleString()} player-games</div></div>
        <div class="kpi"><div class="v">${pct(ar.pair_acc_blend)} <span class="sub">vs ${pct(ar.pair_acc_sleeper)}</span></div><div class="l">Start/sit pairs picked right</div><div class="x">blend vs Sleeper · model alone ${pct(ar.pair_acc_ours)}</div></div>
        ${AL ? `<div class="kpi"><div class="v">${fx(AL.diff_blend, 2)} <span class="sub">pts</span></div><div class="l">League sim: advisor vs Sleeper plans, per team-week</div><div class="x">${AL.ci_blend ? `CI ${fx(AL.ci_blend[0], 2)} to ${fx(AL.ci_blend[1], 2)} · ` : ""}model alone ${fx(AL.diff_model, 2)} · gap capture ${fx(AL.gap_capture_blend * 100, 1)}% (target +10%)</div></div>` : ""}
      </div>
      <div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>Season</th><th class="n">Blend weight (Sleeper)</th><th class="n">Blend</th><th class="n">Model</th><th class="n">Sleeper</th><th class="n">Blend − Sleeper</th><th>95% CI</th></tr></thead><tbody>
        ${(AD.seasons || []).map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.weight != null ? Math.round(r.weight * 100) + "%" : "–"}</td><td class="n"><b>${r.blend.mae_ours.toFixed(3)}</b></td><td class="n">${r.model.mae_ours.toFixed(3)}</td>
          <td class="n">${r.blend.mae_sleeper.toFixed(3)}</td><td class="n">${fx(r.blend.diff)}</td><td>${fx(r.blend.ci[0])} to ${fx(r.blend.ci[1])}${CLEAR(r.blend.clear)}</td></tr>`).join("")}</tbody></table></div>
      ${LSb.length ? `<div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>League sim season</th><th class="n">Team-weeks</th><th class="n">Blend vs Sleeper plans</th><th>95% CI</th><th class="n">Model vs Sleeper plans</th><th class="n">Gap capture blend / model</th><th class="n">Planner optimism blend / model</th></tr></thead><tbody>
        ${LSb.map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.team_weeks}</td><td class="n"><b>${fx(r.diff_blend, 2)}</b></td><td>${fx(r.ci_blend[0], 2)} to ${fx(r.ci_blend[1], 2)}</td><td class="n">${fx(r.diff, 2)}</td>
          <td class="n">${fx(r.gap_capture_blend * 100, 1)}% / ${fx(r.gap_capture * 100, 1)}%</td><td class="n">${r.plan_optimism_blend != null ? fx(r.plan_optimism_blend * 100, 1) + "%" : "–"} / ${r.plan_optimism != null ? fx(r.plan_optimism * 100, 1) + "%" : "–"}</td></tr>`).join("")}</tbody></table></div>
        <p class="caption">Same synthetic 14-team leagues and Lock-In strategy for every source; only the projections differ. Planner optimism = how much the start-of-week plan expected above what it banked; the advisor trims its expected total by this.</p>` : ""}
      ${(AD.availability || []).length ? `<div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>Will he play? (season)</th><th class="n">Games</th><th class="n">DNP rate</th><th class="n">Our model (Brier)</th><th class="n">Advisor, with Sleeper's play/sit signal</th></tr></thead><tbody>
        ${AD.availability.map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.n.toLocaleString()}</td><td class="n">${pct(r.dnp_rate)}</td><td class="n">${r.brier_ours.toFixed(4)}</td><td class="n"><b>${r.brier_advisor.toFixed(4)}</b></td></tr>`).join("")}</tbody></table></div>
        <p class="caption">Lower is better. Whether Sleeper currently projects a player is a strong play/sit signal; the advisor recalibrates P(play) with it, using a table fitted on earlier seasons only.</p>` : ""}
      ${(AD.segments || []).length ? `<details style="margin-top:10px"><summary>Blend vs Sleeper by situation</summary><div class="panel" style="margin-top:8px">
        <p class="caption" style="margin:0">Blend's average miss minus Sleeper's, with 95% CI. <b>◀ Left of the line = the blend is closer.</b> Faded = not statistically clear.</p>
        <div class="seggrid">${[...new Set(AD.segments.filter(x => !x.diagnostic).map(x => x.group))].map(g => `<div><b>${esc(g)}</b>${divergingCI(AD.segments.filter(x => x.group === g && !x.diagnostic).sort((a, b) => a.diff - b.diff).map(x => ({label: x.segment, diff: x.diff, lo: x.ci[0], hi: x.ci[1], clear: x.clear, n: x.n})), g, {w: HALF, axis: false})}</div>`).join("")}</div></div></details>` : ""}`);
  }
}

  renderVs();
  const v = document.getElementById("vs");
  v.insertBefore($(`<div class="secbar" style="display:flex;justify-content:flex-end;margin:10px 0 0">Comparison ${asOf("vs")}${partBtn("vs")} · Lock-In simulation ${asOf("vs_sim")}${partBtn("vs_sim")}</div>`), v.firstChild);

}
function showTab(){
  const vs = location.hash.startsWith("#vs");
  document.getElementById("app").hidden = vs; document.getElementById("vs").hidden = !vs;
