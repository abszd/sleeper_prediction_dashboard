}
window.addEventListener("hashchange", showTab); showTab();

// ---- keep the reader's place across reloads (tab is in the URL hash; scroll, filters, open sections here)
const SKEY = "lockin-dashboard-state";
function saveState() {
  try {
    const st = {y: window.scrollY, hash: location.hash,
      selects: [...document.querySelectorAll("select[id]")].map(e => [e.id, e.value]),
      details: [...document.querySelectorAll("details")].map(d => d.open),
      seg: document.querySelector("#seg button.on") ? document.querySelector("#seg button.on").dataset.g : null};
    sessionStorage.setItem(SKEY, JSON.stringify(st));
  } catch (e) { /* storage unavailable: reload just starts at the top */ }
}
function restoreState() {
  let st = null;
  try { st = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { st = null; }
  if (!st) return;
  (st.selects || []).forEach(([id, v]) => { const e = document.getElementById(id); if (e && [...e.options].some(o => o.value === v)) { e.value = v; e.dispatchEvent(new Event("change")); } });
  const ds = document.querySelectorAll("details"); (st.details || []).forEach((o, i) => { if (ds[i]) ds[i].open = o; });
  if (st.seg) { const b = document.querySelector(`#seg button[data-g="${st.seg}"]`); if (b) b.click(); }
  requestAnimationFrame(() => window.scrollTo(0, st.y || 0));
}
// render the Vs tab first if the saved place was there, so its filters/sections exist before restoring
try { const st = JSON.parse(sessionStorage.getItem(SKEY) || "null"); if (st && (st.hash || "").startsWith("#vs") && !window.__vsDone) { window.__vsDone = true; renderVsTab(); } } catch (e) {}
restoreState();
["scroll", "change", "toggle", "click"].forEach(ev => document.addEventListener(ev, () => { clearTimeout(window.__sv); window.__sv = setTimeout(saveState, 250); }, true));
window.addEventListener("beforeunload", saveState);
// published copy: GitHub's CDN caches pages ~10 min, so "latest" means a cache-busting URL
const goLatest = (v) => { saveState(); if (!PUBLIC) return location.reload();
  location.replace(location.pathname + "?v=" + encodeURIComponent(v || Date.now()) + location.hash); };

// ---- refresh queue: every [data-part] button asks the local helper (scripts/dashboard_server.py, 127.0.0.1:8766)
// to queue that part; jobs run one at a time. When one finishes, the page fetches the new data and redraws in place.
const R = {jobs: null, online: null, seen: null, timer: null, msg: {}};
const HELPER = "http://127.0.0.1:8766";
function partState(n) {
  const J = R.jobs; if (!J) return {state: "idle"};
  const r = J.running;
  if (r && r.part === n) return {state: "running", job: r};
  if (r && (r.parts || []).includes(n)) {
    const i = r.parts.indexOf(n), c = r.parts.indexOf(r.current);
    if (c === i) return {state: "running", job: r};
    if (c < i) return {state: "next", job: r};
  }
  const k = (J.queue || []).findIndex(q => q.part === n || (q.parts || []).includes(n));
  return k >= 0 ? {state: "queued", pos: k + 1, job: J.queue[k]} : {state: "idle"};
}
function paint() {
  const J = R.jobs, r = J && J.running;
  document.querySelectorAll("[data-part]").forEach(b => {
    const n = b.dataset.part, c = catOf(n), st = partState(n);
    const secs = st.job && st.job.started_utc ? Math.round((Date.now() - Date.parse(st.job.started_utc)) / 1000) : null;
    b.classList.toggle("running", st.state === "running"); b.classList.toggle("queued", st.state === "queued" || st.state === "next");
    b.classList.toggle("offline", R.online === false);
    b.disabled = st.state !== "idle";
    b.textContent = R.msg[n] || (st.state === "running" ? `⟳ ${c.label}…${secs != null ? ` ${secs}s` : ""}`
      : st.state === "next" ? `${c.label}: next (after ${catOf(st.job.parts[st.job.parts.indexOf(st.job.current)] || st.job.part).label})`
      : st.state === "queued" ? `${c.label}: queued${st.pos > 1 ? ` (#${st.pos})` : ""}` : `↻ ${c.label}`);
  });
  const ql = document.getElementById("qline");
  if (ql) ql.innerHTML = R.online === false ? (PUBLIC ? "Refreshing only works on the PC running the program (start_dashboard_server.bat or the snapshot task)." : "The helper isn't running: double-click start_dashboard_server.bat (the snapshot task also starts it within 5 minutes).")
    : !J ? "Checking the helper…" : r ? `Running: <b>${esc(r.label)}</b>${r.step ? ` · ${esc(r.step)}` : ""}${(J.queue || []).length ? ` · then ${J.queue.map(q => esc(q.label)).join(", ")}` : ""}`
    : J.external_build ? "A scheduled rebuild is running; queued jobs start after it." : "Idle: nothing queued.";
}
function drawMenu() {
  const m = document.getElementById("menu"); if (!m) return;
  const items = ["all", "status", "lines", "projections", "plan", "recent", "season", "model", "vs", "vs_sim"].map(catOf).filter(c => c.label);
  m.innerHTML = items.map(c => `<div class="mi"><div><b>${esc(c.label)}</b> ${c.name === "all" ? "" : asOf(c.name)}</div>${partBtn(c.name)}
    <div class="d">${esc(c.desc)}${(c.then || []).length ? ` Also redoes: ${c.then.map(x => catOf(x).label).join(", ")}.` : ""} <span class="sub">(usually ${esc(c.est || "?")})</span></div></div>`).join("")
    + `<div class="qline" id="qline"></div>`;
  paint();
}
function redraw() {  // new data -> redraw both tabs in place, keeping your place
  saveState();
  app.innerHTML = ""; render();
  if (window.__vsDone) { document.getElementById("vs").innerHTML = ""; window.__vsDone = false; }
  showTab(); restoreState(); drawMenu(); paint(); showAge();
}
async function loadNewData() {
  if (PUBLIC) {  // the published copy updates when the PC publishes it
    window.__checkVersion && [20, 45, 90, 150].forEach(s => setTimeout(window.__checkVersion, s * 1000)); return; }
  try {
    const nd = await (await fetch(HELPER + "/api/data", {cache: "no-store"})).json();
    if (!nd || nd.error && !nd.plan) return;
    Object.keys(D).forEach(k => delete D[k]); Object.assign(D, nd); window.__liveMap = null; window.__names = null;
    redraw();
  } catch (e) { /* keep the current page */ }
}
async function pollJobs() {
  clearTimeout(R.timer);
  let J = null;
  try { J = await (await fetch(HELPER + "/api/jobs", {cache: "no-store"})).json(); R.online = !J.error; } catch (e) { R.online = false; }
  if (J && !J.error) {
    R.jobs = J;
    const top = (J.history[0] || {}).id || 0;
    if (R.seen === null) R.seen = top;
    else if (top > R.seen) { R.seen = top; loadNewData(); }
    else if (!J.running && !(J.queue || []).length && J.assembled_utc && D.generated_utc && Date.parse(J.assembled_utc) > Date.parse(D.generated_utc) + 1000) {
      // rebuilt by the snapshot job / daily task: redraw if you're not looking, else light up "Reload latest"
      if (document.hidden) loadNewData();
      else { const b = document.getElementById("reload"); if (b) { b.textContent = "New data ↻"; b.classList.add("fresh"); } }
    }
  }
  paint();
  const busy = J && !J.error && (J.running || (J.queue || []).length);
  R.timer = setTimeout(pollJobs, busy ? 2000 : 30000);
}
async function enqueue(part, auto) {
  if (PUBLIC && auto) return;  // the published page never calls your PC on its own
  try {
    const res = await (await fetch(HELPER + "/api/refresh", {method: "POST", cache: "no-store",
      headers: {"X-Lockin": "1", "Content-Type": "application/json"}, body: JSON.stringify({part, auto: !!auto})})).json();
    if (res.error) { R.msg[part] = "Failed to queue"; setTimeout(() => { delete R.msg[part]; paint(); }, 6000); }
    if (res.jobs) R.jobs = res.jobs;
    R.online = true;
  } catch (e) {
    R.online = false;
    if (!auto) { R.msg[part] = PUBLIC ? "Only on your PC" : "Helper not running"; setTimeout(() => { delete R.msg[part]; paint(); }, 6000); }
  }
  paint(); pollJobs();
}
window.__startRefresh = (auto) => enqueue("plan", auto);  // a game of yours went final: its lock-or-pass call
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-part]");
  if (b && !b.disabled) { e.preventDefault(); return enqueue(b.dataset.part, false); }
  const m = document.getElementById("menu"), t = e.target.closest && e.target.closest("#refreshmenu");
  if (t && m) { m.hidden = !m.hidden; if (!m.hidden) { drawMenu(); pollJobs(); } return; }
  if (m && !m.hidden && !(e.target.closest && e.target.closest("#menu"))) m.hidden = true;
  if (e.target.closest && e.target.closest("#reload")) goLatest(window.__newVersion);
});
document.addEventListener("keydown", e => { const m = document.getElementById("menu"); if (e.key === "Escape" && m) m.hidden = true; });
setInterval(() => { if (R.jobs && R.jobs.running) paint(); }, 1000);  // the running job's seconds counter
if (!PUBLIC) {
  // while the dashboard is open: refresh everything once the plan is 20 minutes old
  setInterval(() => { const pm = (D.parts || {}).plan;
    if (pm && pm.as_of && Date.now() - Date.parse(pm.as_of) >= 20 * 60000 && R.online) enqueue("all", true); }, 60000);
}
drawMenu(); pollJobs();

// Live scores computed in the browser (no local helper): the same numbers as lineup/live_scores.py.
// Used by the GitHub Pages copy of the dashboard, and by the local page when the helper isn't running.
// Two public, CORS-open requests: Sleeper's live week stats (your scoring) and ESPN's scoreboard.
// ctx = D.live_ctx (lineup/advisor.py -> data/tmp/live_context.json, embedded at build time).
// fetchJson(url) -> parsed JSON (throws on failure); nowMs = Date.now(). Parity-tested against Python
// in tests/test_publish.py.
const LIVE_DONE = new Set(["STATUS_FINAL", "STATUS_POSTPONED", "STATUS_CANCELED", "STATUS_SUSPENDED", "STATUS_FORFEIT"]);
const LIVE_N = 200;                      // lineup/distributions.py N
const LIVE_IN_PLAY_MS = 4 * 3600e3;      // live_scores.IN_PLAY_MAX
const LIVE_GAME_MS = (2 * 60 + 20) * 60e3;
const LIVE_DERIVED = {fgmi: [["fga", 1], ["fgm", -1]], ftmi: [["fta", 1], ["ftm", -1]], tpmi: [["tpa", 1], ["tpm", -1]],
  pts_reb_ast: [["pts", 1], ["reb", 1], ["ast", 1]], pts_reb: [["pts", 1], ["reb", 1]], pts_ast: [["pts", 1], ["ast", 1]],
  reb_ast: [["reb", 1], ["ast", 1]], blk_stl: [["blk", 1], ["stl", 1]]};

// mean of distributions.from_quantiles(q, p_play): DNP share scores 0, the rest interpolates the quantiles
function liveMeanFromQuantiles(q, pPlay) {
  q = q.slice().sort((a, b) => a - b);
  const n = LIVE_N, nDnp = Math.round((1 - Math.min(1, Math.max(0, pPlay))) * n), m = n - nDnp;
  if (m <= 0 || !q.length) return 0;
  let s = 0;
  for (let k = 0; k < m; k++) {
    const x = (k + 0.5) / m * (q.length - 1), i = Math.min(Math.floor(x), q.length - 2);
    s += q.length === 1 ? q[0] : q[i] + (q[i + 1] - q[i]) * (x - i);
  }
  return s / n;
}

// data/scoring.py fantasy_points_expr: direct stat columns, else derived ones; missing stats count 0
function liveFantasyPoints(recs, scoring) {
  const cols = new Set(); recs.forEach(r => Object.keys(r).forEach(k => cols.add(k)));
  const terms = [];
  Object.entries(scoring || {}).forEach(([k, c]) => {
    if (!c) return;
    if (cols.has(k)) terms.push(r => (Number(r[k]) || 0) * c);
    else if (LIVE_DERIVED[k] && LIVE_DERIVED[k].every(([n]) => cols.has(n)))
      terms.push(r => LIVE_DERIVED[k].reduce((a, [n, w]) => a + w * (Number(r[n]) || 0), 0) * c);
  });
  recs.forEach(r => { r.fp = terms.reduce((a, t) => a + t(r), 0); });
  return recs;
}

// Python round() on the stored double (toFixed rounds its exact decimal value, as Python does)
const rnd = (x, d) => Number(Number(x).toFixed(d));

function liveEtDate(ms) { return new Date(ms).toLocaleDateString("en-CA", {timeZone: "America/New_York"}); }

async function liveBoard(etDate, alias, fetchJson) {
  const out = {};
  let payload;
  try { payload = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${etDate.replace(/-/g, "")}`); }
  catch (e) { return out; }
  (payload.events || []).forEach(ev => {
    const comp = ev.competitions[0], teams = {};
    comp.competitors.forEach(c => { teams[c.homeAway] = alias[c.team.abbreviation] || c.team.abbreviation; });
    const st = ev.status || {}, name = (st.type || {}).name, period = parseInt(st.period || 0, 10) || 0;
    const clock = (Number(st.clock) || 0) / 60;
    const left = LIVE_DONE.has(name) ? 0 : period <= 0 ? 1 : period <= 4 ? Math.max(0, ((4 - period) * 12 + clock) / 48) : 0;
    out[`${teams.home}|${teams.away}`] = {status: name, left};
  });
  return out;
}

async function computeLiveBrowser(ctx, fetchJson, nowMs) {
  const out = {as_of_utc: new Date(nowMs).toISOString(), context_utc: ctx ? ctx.written_utc : null, games: {}, players: {}, source: "browser"};
  if (!ctx) return out;
  const started = Object.entries(ctx.games || {}).filter(([, g]) => { if (!g.tip_utc) return false;
    const dt = nowMs - Date.parse(g.tip_utc); return dt >= 0 && dt <= LIVE_IN_PLAY_MS; });
  if (!started.length) return out;
  const board = {};
  for (const d of [...new Set(started.map(([, g]) => liveEtDate(Date.parse(g.tip_utc))))].sort())
    Object.assign(board, await liveBoard(d, ctx.espn_alias || {}, fetchJson));
  started.forEach(([gid, g]) => {
    const b = board[`${g.home}|${g.away}`];
    const left = b ? b.left : Math.max(0, 1 - (nowMs - Date.parse(g.tip_utc)) / LIVE_GAME_MS);
    out.games[gid] = {status: b ? b.status : null, left: rnd(left, 3), final: !!(b && LIVE_DONE.has(b.status))};
  });
  const rows = await fetchJson(`https://api.sleeper.com/stats/nba/${ctx.season}/${ctx.week}?season_type=regular`) || [];
  const recs = rows.filter(r => /^\d+$/.test(String(r.player_id)) && r.stats && Object.keys(r.stats).length)
    .map(r => Object.assign({}, r.stats, {player_id: String(r.player_id), game_id: String(r.game_id), date: r.date}))
    .sort((a, b) => a.player_id < b.player_id ? -1 : a.player_id > b.player_id ? 1 : String(a.date) < String(b.date) ? -1 : String(a.date) > String(b.date) ? 1 : 0);
  const line = {};
  liveFantasyPoints(recs, ctx.scoring).forEach(r => { line[`${r.player_id}|${r.game_id}`] = r; });
  const r1 = (x) => rnd(x, 1);
  (ctx.players || []).forEach(p => {
    const gm = out.games[p.game_id]; if (!gm) return;
    const ln = line[`${p.player_id}|${p.game_id}`] || {};
    const soFar = Number(ln.fp) || 0, mins = Number(ln.min) || 0;
    const mean = liveMeanFromQuantiles(p.fp_q.map(q => soFar + gm.left * q), mins > 0 ? 1 : p.p_play);
    out.players[`${p.player_id}|${p.game_id}`] = {so_far: r1(soFar), minutes: r1(mins), left: rnd(gm.left, 2),
      proj_final: r1(gm.final ? soFar : mean), final: gm.final};
  });
  return out;
}

if (typeof module !== "undefined") module.exports = {computeLiveBrowser, liveMeanFromQuantiles, liveFantasyPoints};

// ---- live scores: fast path through the helper (/api/live, no model run), every 90 s while a game is on.
// Patches the live numbers into D and redraws in place (no reload). A game of yours going final triggers a full
// refresh so its lock-or-pass call shows up.
(function () {
  if (!D || D.error || !window.__redrawLive) return;
  const API = "http://127.0.0.1:8766/api/live", IN_PLAY = 4 * 3600e3;
  const rows = () => [...(D.plan || []).flatMap(s => s.steps || []), ...Object.values(D.mode_plans || {}).flatMap(mp => mp.flatMap(s => s.steps || [])),
    ...(D.tonight || []), ...((D.opponent || {}).players || []).map(x => Object.assign(x, {tip_utc: x.tip_utc || x.next_tip}))];
  const onNow = () => rows().some(x => { const dt = Date.now() - new Date(x.tip_utc).getTime(); return x.game_id && dt >= 0 && dt < IN_PLAY && !(x.live && x.live.final); });
  const mine = () => new Set((D.plan || []).flatMap(s => (s.steps || []).map(x => x.player_id + "|" + x.game_id)));
  let wasFinal = new Set(rows().filter(x => x.live && x.live.final).map(x => x.player_id + "|" + x.game_id));
  // the local helper when it's reachable (local page only); otherwise straight from Sleeper + ESPN in this browser
  const viaBrowser = () => computeLiveBrowser(D.live_ctx, async (u) => { const res = await fetch(u, {cache: "no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); }, Date.now());
  const tick = async () => {
    if (!onNow()) return;
    let r = null;
    if (!PUBLIC) { try { r = await (await fetch(API, {cache: "no-store"})).json(); } catch (e) { r = null; } }
    if ((!r || r.error || !r.players) && D.live_ctx) { try { r = await viaBrowser(); } catch (e) { r = null; } }
    if (!r || r.error || !r.players) return;
    let newFinal = false;
    rows().forEach(x => { const k = x.player_id + "|" + x.game_id, v = r.players[k]; if (!v) return;
      x.live = v; if ("mean" in x && !("next_tip" in x)) x.mean = v.proj_final;
      if (v.final && !wasFinal.has(k)) { wasFinal.add(k); if (mine().has(k)) newFinal = true; } });
    D.live_as_of = r.as_of_utc;
    window.__liveMap = Object.assign({}, liveMap(), r.players);
    const el = document.getElementById("liveage"); if (el) el.textContent = `· live ${local(r.as_of_utc)}`;
    try { window.__redrawLive(); } catch (e) { /* keep polling */ }
    if (newFinal && window.__startRefresh) window.__startRefresh(true);
  };
  tick(); setInterval(tick, PUBLIC ? 60000 : 90000);
})();

// published copy: notice a newer publish (version.json, written by scripts/publish_pages.py). Hidden tab -> load it;
// visible -> light up "Reload latest" so the page never jumps while you read.
(function () {
  if (!PUBLIC || !D) return;
  const check = async () => {
    let v; try { v = await (await fetch("version.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) { return; }
    if (!v || !v.generated_utc || !D.generated_utc || Date.parse(v.generated_utc) <= Date.parse(D.generated_utc)) return;
    window.__newVersion = v.generated_utc;
    if (document.hidden) return goLatest(v.generated_utc);
    const b = document.getElementById("reload");
    if (b) { b.textContent = "New data ↻"; b.classList.add("fresh"); b.title = `A newer build was published (${local(v.generated_utc)}). Click to load it.`; }
  };
  window.__checkVersion = check;
  setTimeout(check, 5000); setInterval(check, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
})();

// data age + quiet auto-refresh: only while the page is NOT visible, so it never moves you while reading
const loadedAt = Date.now();
function showAge() {
  const el = document.getElementById("age"); if (!el || !D || !D.generated_utc) return;
  const mins = Math.round((Date.now() - new Date(D.generated_utc).getTime()) / 60000);
  el.textContent = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
}
showAge(); setInterval(showAge, 30000);
setInterval(() => { if (!PUBLIC && document.hidden && Date.now() - loadedAt > 10 * 60000) { saveState(); location.reload(); } }, 60000);
