  // ---- filters + view-dependent sections
  const seasons = ["all", ...(V.seasons || []).map(String), "live"];
  const sLabel = s => s === "all" ? "All seasons" : s === "live" ? "Live forward test" : `${s}-${String(+s + 1).slice(2)}${+s === Math.max(...V.seasons) ? " (this season)" : ""}`;
  addV(`<div class="filters" id="vs-filters">
    <label>Season <select id="f-season">${seasons.map(s => `<option value="${s}">${sLabel(s)}</option>`).join("")}</select></label>
    <label>Players <select id="f-who"><option value="all">All NBA players</option><option value="roster">My roster</option></select></label>
    <label>Left-early games <select id="f-le"><option value="incl">Included</option><option value="excl">Excluded</option></select></label>
    <span class="sub" id="f-n"></span></div><div id="vs-view"></div>`);
  const draw = () => {
    const key = `${document.getElementById("f-season").value}|${document.getElementById("f-who").value}|${document.getElementById("f-le").value}`;
    const v = V.views[key] || {headline: {n: 0}}, box = document.getElementById("vs-view");
    box.innerHTML = "";
    const A = (h) => box.append($(h));
    const h = v.headline || {};
    document.getElementById("f-n").textContent = h.n ? `${h.n.toLocaleString()} player-games · ${h.days} game days` : "";
    if (!h.n) { A(`<p class="empty">Not enough data for this selection yet.</p>`); return; }

    // verdict
    const good = h.diff < 0;
    A(`<h2 id="vs-verdict">Verdict</h2><div class="panel"><div class="big" style="margin-bottom:8px">${good ? "We're more accurate" : "Sleeper is more accurate"} by <b>${Math.abs(h.diff).toFixed(3)}</b> fantasy pts per player-game
      <span class="sub">(95% CI ${fx(h.ci[0])} to ${fx(h.ci[1])})</span>${h.clear ? ` <span class="tag ${good ? "good" : "warn"}">statistically clear</span>` : CLEAR(false)}</div>
      ${pairBars([{label: "Avg miss (MAE)", a: h.mae_ours, b: h.mae_sleeper}, {label: "Root-mean-square miss", a: h.rmse_ours, b: h.rmse_sleeper}, {label: "Median miss", a: h.medae_ours, b: h.medae_sleeper}], {fmt: v => v.toFixed(3), label: "Accuracy"})}
      <div class="vrow" style="margin-top:8px">
        <div class="kpi"><div class="v">${pct(h.win_rate)}</div><div class="l">Games where we were closer</div></div>
        <div class="kpi"><div class="v">${pct(h.big_miss_ours)} <span class="sub">vs ${pct(h.big_miss_sleeper)}</span></div><div class="l">Big misses (off by 10+)</div></div>
        <div class="kpi"><div class="v">${fx(h.bias_ours, 2)} <span class="sub">vs ${fx(h.bias_sleeper, 2)}</span></div><div class="l">Bias (+ = projected too high)</div></div></div>
      <p class="caption">Lower bars are better. Bold value = the more accurate source.</p></div>`);

    // by season (only in "all" season view)
    if (document.getElementById("f-season").value === "all") {
      const who = document.getElementById("f-who").value, le = document.getElementById("f-le").value;
      const rows = (V.seasons || []).map(s => ({s, h: (V.views[`${s}|${who}|${le}`] || {}).headline})).filter(r => r.h && r.h.n);
      A(`<h2>By season</h2><div class="panel">${divergingCI(rows.map(r => ({label: sLabel(String(r.s)), diff: r.h.diff, lo: r.h.ci[0], hi: r.h.ci[1], clear: r.h.clear, n: r.h.n})), "By season")}
        <p class="caption">Dot = our average miss minus Sleeper's; line = 95% CI. Left of zero = we're better. Faded = not statistically clear.</p></div>`);
    }

    // segments
    const segs = v.segments || [];
    if (segs.length) {
      const groups = [...new Set(segs.map(s => s.group))];
      const pre = segs.filter(s => !s.diagnostic && !/unknown|no line|no report|no history/.test(s.segment));
      const top = pre.filter(s => s.clear && s.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 5);
      const weak = pre.filter(s => s.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 5);
      A(`<h2 id="vs-seg">Where we're better and where we're worse</h2>
        <div class="twocol"><div class="panel"><b>Biggest edges</b><ol style="margin:6px 0 0 18px;padding:0">${top.map(s => `<li><span class="tag standout">standout</span> ${esc(s.group)}: <b>${esc(s.segment)}</b> ${fx(s.diff)} <span class="sub">n=${s.n.toLocaleString()}</span></li>`).join("") || "<li class='empty'>none clear yet</li>"}</ol></div>
        <div class="panel"><b>Weak spots</b><ol style="margin:6px 0 0 18px;padding:0">${weak.map(s => `<li>${esc(s.group)}: <b>${esc(s.segment)}</b> ${fx(s.diff)}${CLEAR(s.clear)} <span class="sub">n=${s.n.toLocaleString()}</span></li>`).join("") || "<li class='empty'>no segment where Sleeper is better</li>"}</ol></div></div>
        <div class="panel" style="margin-top:10px"><p class="caption" style="margin:0">Each row: our average miss minus Sleeper's for that kind of game, with 95% CI.
          <b>◀ Left of the line = we're more accurate</b>, right = Sleeper. Faded rows aren't statistically clear yet. Hover a row for exact numbers.</p>
          <div class="seggrid">${groups.map(g => `<div><b>${esc(g)}</b>${segs.find(s => s.group === g).diagnostic ? ' <span class="tag">post-game diagnostic</span>' : ""}
          ${divergingCI(segs.filter(s => s.group === g).sort((a, b) => a.diff - b.diff).map(s => ({label: s.segment, diff: s.diff, lo: s.ci[0], hi: s.ci[1], clear: s.clear, n: s.n})), g, {w: HALF, axis: false})}</div>`).join("")}</div></div>`);
    }

    // per stat
    const ps = v.per_stat || [];
    if (ps.length) A(`<h2 id="vs-stats">Per stat</h2><div class="twocol">
      <div class="panel"><b>Average miss per stat</b>${pairBars(ps.map(s => ({label: s.stat.toUpperCase(), sub: `weight ${s.weight}`, a: s.mae_ours, b: s.mae_sleeper})), {fmt: v => v.toFixed(2), label: "Per-stat MAE", w: HALF})}<p class="caption">Lower is better (in the stat's own units).</p></div>
      <div class="panel"><b>Bias in your fantasy points</b>${pairDots(ps.map(s => ({label: s.stat.toUpperCase(), a: s.fp_bias_ours, b: s.fp_bias_sleeper, n: h.n})), {fmt: v => fx(v), neg: "projected too low", pos: "too high", label: "Bias"})}
      <p class="caption">Average over (+) or under (−) projection of each stat, converted to fantasy points with your scoring. Closer to 0 is better; bold = closer.</p></div></div>`);

    // minutes
    const mn = v.minutes || {};
    if (mn.min_mae_ours != null) A(`<h2>Minutes vs production</h2><div class="panel">${pairBars([{label: "Minutes miss", sub: "avg minutes off", a: mn.min_mae_ours, b: mn.min_mae_sleeper}, {label: "Fantasy miss", sub: "as projected", a: mn.fp_mae_ours, b: mn.fp_mae_sleeper}, {label: "…if minutes were known", sub: "same per-minute rate", a: mn.fp_mae_if_true_min_ours, b: mn.fp_mae_if_true_min_sleeper}], {fmt: v => v.toFixed(2), label: "Minutes"})}
      <p class="caption">Minutes explain about ${pct(mn.share_from_minutes_ours, 0)} of our fantasy-point miss and ${pct(mn.share_from_minutes_sleeper, 0)} of Sleeper's. Minutes bias: ours ${fx(mn.min_bias_ours, 2)} min, Sleeper ${fx(mn.min_bias_sleeper, 2)} min.</p></div>`);

    // calibration + coverage
    if ((v.calibration || []).length) A(`<h2>Calibration</h2><div class="panel">${calibration(v.calibration)}
      <p class="caption">For each tenth of projections, the average projection (x) vs what actually happened (y). On the dashed line = unbiased at that level. ${v.coverage && v.coverage.inside_p10_p90 != null ? `Our floor–ceiling range contained ${pct(v.coverage.inside_p10_p90)} of results (target 80%; below floor ${pct(v.coverage.below_floor)}, above ceiling ${pct(v.coverage.above_ceiling)}).` : ""}</p></div>`);

    // decisions
    const rk = v.ranking || {}, dg = v.disagreements || {};
    if (rk.pairs || (dg.buckets || []).length) A(`<h2 id="vs-decide">Start/sit decisions</h2><div class="twocol">
      ${rk.pairs ? `<div class="panel"><b>Ranking similar players</b>${pairBars([{label: "Picks the better of two", sub: "players within 5 pts", a: rk.pair_acc_ours, b: rk.pair_acc_sleeper}, {label: "Daily rank correlation", sub: "Spearman", a: rk.spearman_ours, b: rk.spearman_sleeper}], {fmt: v => (v * 100).toFixed(1) + (v < 1 ? "%" : ""), higherBetter: true, label: "Ranking", w: HALF})}
        <p class="caption">Higher is better. ${rk.pairs.toLocaleString()} close player pairs over ${rk.days} game days. This is what decides start/sit and lock calls.</p></div>` : ""}
      ${(dg.buckets || []).length ? `<div class="panel"><b>When we disagree with Sleeper</b>${pairBars(dg.buckets.map(b => ({label: b.bucket + " apart", sub: `n=${b.n.toLocaleString()} · we're closer ${pct(b.we_closer)}`, a: b.mae_ours, b: b.mae_sleeper})), {fmt: v => v.toFixed(2), label: "Disagreements", w: HALF})}
        <p class="caption">Average miss when the two projections differ by that much. Lower is better.</p></div>` : ""}</div>
      ${(dg.recent_biggest || []).length ? `<div class="subhead">Biggest recent disagreements — who was right</div><div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Player</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Actual</th><th>Closer</th></tr></thead><tbody>
        ${moreRows(dg.recent_biggest.map(r => `<tr><td>${esc(r.date.slice(5))}</td><td>${who(r.player_id, r.player, true)}</td><td class="n">${f1(r.ours)}</td><td class="n">${f1(r.sleeper)}</td><td class="n"><b>${f1(r.actual)}</b></td><td><span class="tag ${r.winner === "ours" ? "good" : "warn"}">${r.winner === "ours" ? "ours" : "Sleeper"}</span></td></tr>`), 8, 6)}</tbody></table></div>` : ""}`);

    // over time
    const ot = v.over_time || [];
    if (ot.length > 1) A(`<h2 id="vs-time">Over time</h2><div class="panel">${lineCI(ot.map(o => ({x: `${String(o.season).slice(2)} w${o.week}`, y: o.diff, lo: o.ci[0], hi: o.ci[1]})), "Weekly difference")}
      <p class="caption">Weekly average miss, ours minus Sleeper's (below 0 = we were better that week), with 95% CI band.</p></div>`);

    // players & teams
    const pl = v.players || {}, tm = v.teams || {};
    if ((pl.best || []).length) {
      const tbl = (rows, title) => `<div class="panel"><b>${title}</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th>Player</th><th class="n">Games</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Diff</th></tr></thead><tbody>
        ${rows.slice(0, 12).map(r => `<tr><td>${who(r.id, r.label, true)}</td><td class="n">${r.n}</td><td class="n">${r.mae_ours.toFixed(2)}</td><td class="n">${r.mae_sleeper.toFixed(2)}</td><td class="n"><span class="tag ${r.diff < 0 ? "good" : "warn"}">${fx(r.diff, 2)}</span></td></tr>`).join("")}</tbody></table></div></div>`;
      A(`<h2 id="vs-players">Players we read better / worse</h2><div class="twocol">${tbl(pl.best, "We're better on")}${tbl(pl.worst, "Sleeper is better on")}</div>
        <p class="caption">Average miss per player (min 20 shared games; ${pl.count} players qualify). Use the Players filter to see only your roster.</p>`);
    }
    if ((tm.best || []).length) A(`<details><summary>By NBA team</summary><div class="panel" style="margin-top:8px">${divergingCI(tm.best.map(t => ({label: t.label, diff: t.diff, lo: t.diff, hi: t.diff, clear: true, n: t.n})), "Teams")}<p class="caption">Our average miss minus Sleeper's for each team's players.</p></div></details>`);

    // macro
    const M = v.macro || {};
    if ((M.league_by_season || []).length) {
      const st = M.stat_totals || [], tg = M.team_game || {}, lt = M.leaders_top50 || [];
      A(`<h2 id="vs-macro">Combined totals (macro)</h2><div class="twocol">
        <div class="panel"><b>Total fantasy points: projected vs actual</b>${pairDots(M.league_by_season.map(s => ({label: SL(s.season), a: s.ours_pct, b: s.sleeper_pct, n: s.n})), {fmt: v => fx(v, 1) + "%", neg: "too low", pos: "too high", label: "League totals"})}
          <p class="caption">How far each source's season total was from the real total. Closer to 0 is better; bold = closer.</p></div>
        <div class="panel"><b>Per-stat league totals</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th>Stat</th><th class="n">Actual</th><th class="n">Ours off by</th><th class="n">Sleeper off by</th></tr></thead><tbody>
          ${st.map(s => `<tr><td>${s.stat.toUpperCase()}</td><td class="n">${Math.round(s.actual).toLocaleString()}</td><td class="n">${fx(s.ours_pct, 1)}%</td><td class="n">${fx(s.sleeper_pct, 1)}%</td></tr>`).join("")}</tbody></table></div></div></div>
        <div class="twocol" style="margin-top:10px"><div class="vrow" style="align-content:start">
          <div class="kpi"><div class="v">${f1(tg.mae_ours)} <span class="sub">vs ${f1(tg.mae_sleeper)}</span></div><div class="l">Team-game total miss</div><div class="x">Sum of a team's players: ours vs Sleeper</div></div>
          <div class="kpi"><div class="v">${fx(tg.bias_ours, 1)} <span class="sub">vs ${fx(tg.bias_sleeper, 1)}</span></div><div class="l">Team-game total bias</div><div class="x">+ = projected too high</div></div></div>
          ${lt.length ? `<div class="panel"><b>Top-50 scorers caught</b><div class="tablewrap" style="margin-top:6px"><table class="t"><thead><tr><th></th>${lt.map(l => `<th class="n">${SL(l.season)}</th>`).join("")}</tr></thead><tbody>
            <tr><td>Ours</td>${lt.map(l => `<td class="n">${l.overlap_ours > l.overlap_sleeper ? `<b>${l.overlap_ours}</b>` : l.overlap_ours}</td>`).join("")}</tr>
            <tr><td>Sleeper</td>${lt.map(l => `<td class="n">${l.overlap_sleeper > l.overlap_ours ? `<b>${l.overlap_sleeper}</b>` : l.overlap_sleeper}</td>`).join("")}</tr></tbody></table></div>
            <p class="caption">Of each season's real top-50 scorers, how many each source also had in its own top 50.</p></div>` : ""}</div>`);
    }
  };
  ["f-season", "f-who", "f-le"].forEach(id => document.getElementById(id).addEventListener("change", draw));
  draw();

  // ---- live + versions (independent)
  const lv = (V.views["live|all|incl"] || {}).headline || {};
  addV(`<h2>Live forward test</h2><div class="panel">${lv.n ? `Our live pre-lock projections vs Sleeper's pre-lock snapshots: <b>${lv.mae_ours.toFixed(3)}</b> vs <b>${lv.mae_sleeper.toFixed(3)}</b> over ${lv.n} player-games${CLEAR(lv.clear)}` : `<span class="empty">Fills in as live games finish (started 2026-11-06). Select “Live forward test” above for full detail once there's data.</span>`}</div>`);
  const VV = V.versions || [];
  if (VV.length) addV(`<h2 id="vs-versions">Model versions</h2><div class="tablewrap"><table class="t"><thead><tr><th>Season</th><th>Version</th><th class="n">Player-games</th><th class="n">Ours</th><th class="n">Sleeper</th><th class="n">Diff</th><th>95% CI</th></tr></thead><tbody>
    ${VV.sort((a, b) => a.season - b.season || String(a.version).localeCompare(String(b.version))).map(r => `<tr><td>${r.season}-${String(r.season + 1).slice(2)}</td><td>${esc(r.version)}</td><td class="n">${r.n.toLocaleString()}</td><td class="n">${r.ours.toFixed(3)}</td><td class="n">${r.sleeper.toFixed(3)}</td><td class="n">${fx(r.diff)}</td><td>${esc(r.ci)}</td></tr>`).join("")}</tbody></table></div>
    <p class="caption">Each model version's full-season backtest. "props (provisional)" isn't used live until the props check passes.</p>`);

  // ---- ADVISOR BLEND: separate from everything above (never counted as the model beating Sleeper)
  const AD = V.advisor || {};
  if (AD.headline && AD.headline.n) {
    const ah = AD.headline, mh = AD.model_headline || {}, ar = AD.ranking || {}, AL = AD.league || null;
    const sl = (s) => `${s}-${String(s + 1).slice(2)}`;
    const LSb = ((V.league_sim || {}).seasons || []).filter(r => r.diff_blend != null);
    addV(`<h2 id="vs-advisor">Advisor (blend): not counted as model vs Sleeper</h2>
      <div class="banner info" style="margin-bottom:10px"><b>What this is</b>Lineup advice may blend our model with Sleeper's live projection (you approved this 2026-11-06).
        Everything above is the model alone, which never sees Sleeper. Each season's blend weight is fitted on earlier seasons only, so these are honest out-of-sample results.</div>
      <div class="vrow">
        <div class="kpi"><div class="v">${(ah.mae_ours).toFixed(3)} <span class="sub">vs ${(ah.mae_sleeper).toFixed(3)}</span></div><div class="l">Blend vs Sleeper avg miss${CLEAR(ah.clear)}</div><div class="x">${fx((ah.mae_ours / ah.mae_sleeper - 1) * 100, 1)}% · CI ${fx(ah.ci[0])} to ${fx(ah.ci[1])}</div></div>
        <div class="kpi"><div class="v">${mh.mae_ours != null ? mh.mae_ours.toFixed(3) : "–"}</div><div class="l">Model alone, same games</div><div class="x">${ah.n.toLocaleString()} player-games</div></div>
        <div class="kpi"><div class="v">${pct(ar.pair_acc_blend)} <span class="sub">vs ${pct(ar.pair_acc_sleeper)}</span></div><div class="l">Start/sit pairs picked right</div><div class="x">blend vs Sleeper · model alone ${pct(ar.pair_acc_ours)}</div></div>
        ${AL ? `<div class="kpi"><div class="v">${fx(AL.diff_blend, 2)} <span class="sub">pts</span></div><div class="l">League sim: advisor vs Sleeper plans, per team-week</div><div class="x">${AL.ci_blend ? `CI ${fx(AL.ci_blend[0], 2)} to ${fx(AL.ci_blend[1], 2)} · ` : ""}model alone ${fx(AL.diff_model, 2)} · gap capture ${fx(AL.gap_capture_blend * 100, 1)}% (target +10%)</div></div>` : ""}
      </div>
      <div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>Season</th><th class="n">Blend weight (Sleeper)</th><th class="n">Blend</th><th class="n">Model</th><th class="n">Sleeper</th><th class="n">Blend − Sleeper</th><th>95% CI</th></tr></thead><tbody>
        ${(AD.seasons || []).map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.weight != null ? Math.round(r.weight * 100) + "%" : "–"}</td><td class="n"><b>${r.blend.mae_ours.toFixed(3)}</b></td><td class="n">${r.model.mae_ours.toFixed(3)}</td>
          <td class="n">${r.blend.mae_sleeper.toFixed(3)}</td><td class="n">${fx(r.blend.diff)}</td><td>${fx(r.blend.ci[0])} to ${fx(r.blend.ci[1])}${CLEAR(r.blend.clear)}</td></tr>`).join("")}</tbody></table></div>
      ${LSb.length ? `<div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>League sim season</th><th class="n">Team-weeks</th><th class="n">Blend vs Sleeper plans</th><th>95% CI</th><th class="n">Model vs Sleeper plans</th><th class="n">Gap capture blend / model</th><th class="n">Planner optimism blend / model</th></tr></thead><tbody>
        ${LSb.map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.team_weeks}</td><td class="n"><b>${fx(r.diff_blend, 2)}</b></td><td>${fx(r.ci_blend[0], 2)} to ${fx(r.ci_blend[1], 2)}</td><td class="n">${fx(r.diff, 2)}</td>
          <td class="n">${fx(r.gap_capture_blend * 100, 1)}% / ${fx(r.gap_capture * 100, 1)}%</td><td class="n">${r.plan_optimism_blend != null ? fx(r.plan_optimism_blend * 100, 1) + "%" : "–"} / ${r.plan_optimism != null ? fx(r.plan_optimism * 100, 1) + "%" : "–"}</td></tr>`).join("")}</tbody></table></div>
        <p class="caption">Same synthetic 14-team leagues and Lock-In strategy for every source; only the projections differ. Planner optimism = how much the start-of-week plan expected above what it banked; the advisor trims its expected total by this.</p>` : ""}
      ${(AD.availability || []).length ? `<div class="tablewrap" style="margin-top:10px"><table class="t"><thead><tr><th>Will he play? (season)</th><th class="n">Games</th><th class="n">DNP rate</th><th class="n">Our model (Brier)</th><th class="n">Advisor, with Sleeper's play/sit signal</th></tr></thead><tbody>
        ${AD.availability.map(r => `<tr><td>${sl(r.season)}</td><td class="n">${r.n.toLocaleString()}</td><td class="n">${pct(r.dnp_rate)}</td><td class="n">${r.brier_ours.toFixed(4)}</td><td class="n"><b>${r.brier_advisor.toFixed(4)}</b></td></tr>`).join("")}</tbody></table></div>
        <p class="caption">Lower is better. Whether Sleeper currently projects a player is a strong play/sit signal; the advisor recalibrates P(play) with it, using a table fitted on earlier seasons only.</p>` : ""}
      ${(AD.segments || []).length ? `<details style="margin-top:10px"><summary>Blend vs Sleeper by situation</summary><div class="panel" style="margin-top:8px">
        <p class="caption" style="margin:0">Blend's average miss minus Sleeper's, with 95% CI. <b>◀ Left of the line = the blend is closer.</b> Faded = not statistically clear.</p>
        <div class="seggrid">${[...new Set(AD.segments.filter(x => !x.diagnostic).map(x => x.group))].map(g => `<div><b>${esc(g)}</b>${divergingCI(AD.segments.filter(x => x.group === g && !x.diagnostic).sort((a, b) => a.diff - b.diff).map(x => ({label: x.segment, diff: x.diff, lo: x.ci[0], hi: x.ci[1], clear: x.clear, n: x.n})), g, {w: HALF, axis: false})}</div>`).join("")}</div></div></details>` : ""}`);
  }
}

function renderVsTab(){
  renderVs();
  const v = document.getElementById("vs");
  v.insertBefore($(`<div class="secbar" style="display:flex;justify-content:flex-end;margin:10px 0 0">Comparison ${asOf("vs")}${partBtn("vs")} · Lock-In simulation ${asOf("vs_sim")}${partBtn("vs_sim")}</div>`), v.firstChild);
  try { paint(); } catch (e) { /* drawn before the refresh controller starts: it paints every button once it does */ }
}
function showTab(){
  const vs = location.hash.startsWith("#vs");
  document.getElementById("app").hidden = vs; document.getElementById("vs").hidden = !vs;
  document.getElementById("t-vs").classList.toggle("on", vs); document.getElementById("t-team").classList.toggle("on", !vs);
  if (vs && !window.__vsDone) { window.__vsDone = true; try { renderVsTab(); } catch (e) { document.getElementById("vs").innerHTML = "<p class='empty'>Couldn't render: " + e + "</p>"; } }
}
window.addEventListener("hashchange", showTab); showTab();

// ---- keep the reader's place across reloads (tab is in the URL hash; scroll, filters, open sections here)
const SKEY = "lockin-dashboard-state";
function saveState() {
  try {
    const st = {y: window.scrollY, hash: location.hash,
      selects: [...document.querySelectorAll("select[id]:not(#teamsel)")].map(e => [e.id, e.value]),
      details: [...document.querySelectorAll("details")].map(d => d.open),
      seg: document.querySelector("#seg button.on") ? document.querySelector("#seg button.on").dataset.g : null};
    sessionStorage.setItem(SKEY, JSON.stringify(st));
  } catch (e) { /* storage unavailable: reload just starts at the top */ }
}
function restoreState() {
  let st = null;
  try { st = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { st = null; }
  if (!st) return;
  (st.selects || []).forEach(([id, v]) => { const e = document.getElementById(id); if (e && [...e.options].some(o => o.value === v)) { e.value = v; e.dispatchEvent(new Event("change")); } });
  const ds = document.querySelectorAll("details"); (st.details || []).forEach((o, i) => { if (ds[i]) ds[i].open = o; });
  if (st.seg) { const b = document.querySelector(`#seg button[data-g="${st.seg}"]`); if (b) b.click(); }
  requestAnimationFrame(() => window.scrollTo(0, st.y || 0));
}
// render the Vs tab first if the saved place was there, so its filters/sections exist before restoring
try { const st = JSON.parse(sessionStorage.getItem(SKEY) || "null"); if (st && (st.hash || "").startsWith("#vs") && !window.__vsDone) { window.__vsDone = true; renderVsTab(); } } catch (e) {}
restoreState();
["scroll", "change", "toggle", "click"].forEach(ev => document.addEventListener(ev, () => { clearTimeout(window.__sv); window.__sv = setTimeout(saveState, 250); }, true));
window.addEventListener("beforeunload", saveState);
// published copy: GitHub's CDN caches pages ~10 min, so "latest" means a cache-busting URL
const goLatest = (v) => { saveState(); if (!PUBLIC) return location.reload();
  location.replace(location.pathname + "?v=" + encodeURIComponent(v || Date.now()) + location.hash); };

// ---- refresh queue: every [data-part] button asks the local helper (scripts/dashboard_server.py, 127.0.0.1:8766)
// to queue that part; jobs run one at a time. When one finishes, the page fetches the new data and redraws in place.
const R = {jobs: null, online: null, seen: null, timer: null, msg: {}};
const HELPER = "http://127.0.0.1:8766";
function partState(n) {
  const J = R.jobs; if (!J) return {state: "idle"};
  const r = J.running;
  if (r && r.part === n) return {state: "running", job: r};
  if (r && (r.parts || []).includes(n)) {
    const i = r.parts.indexOf(n), c = r.parts.indexOf(r.current);
    if (c === i) return {state: "running", job: r};
    if (c < i) return {state: "next", job: r};
  }
  const k = (J.queue || []).findIndex(q => q.part === n || (q.parts || []).includes(n));
  return k >= 0 ? {state: "queued", pos: k + 1, job: J.queue[k]} : {state: "idle"};
}
function paint() {
  const J = R.jobs, r = J && J.running;
  document.querySelectorAll("[data-part]").forEach(b => {
    const n = b.dataset.part, c = catOf(n), st = partState(n);
    const secs = st.job && st.job.started_utc ? Math.round((Date.now() - Date.parse(st.job.started_utc)) / 1000) : null;
    b.classList.toggle("running", st.state === "running"); b.classList.toggle("queued", st.state === "queued" || st.state === "next");
    b.classList.toggle("offline", R.online === false);
    b.disabled = st.state !== "idle";
    b.textContent = R.msg[n] || (st.state === "running" ? `⟳ ${c.label}…${secs != null ? ` ${secs}s` : ""}`
      : st.state === "next" ? `${c.label}: next (after ${catOf(st.job.parts[st.job.parts.indexOf(st.job.current)] || st.job.part).label})`
      : st.state === "queued" ? `${c.label}: queued${st.pos > 1 ? ` (#${st.pos})` : ""}` : `↻ ${c.label}`);
  });
  const ql = document.getElementById("qline");
  if (ql) ql.innerHTML = R.online === false ? (PUBLIC ? "Refreshing only works on the PC running the program (start_dashboard_server.bat or the snapshot task)." : "The helper isn't running: double-click start_dashboard_server.bat (the snapshot task also starts it within 5 minutes).")
    : !J ? "Checking the helper…" : r ? `Running: <b>${esc(r.label)}</b>${r.step ? ` · ${esc(r.step)}` : ""}${(J.queue || []).length ? ` · then ${J.queue.map(q => esc(q.label)).join(", ")}` : ""}`
    : J.external_build ? "A scheduled rebuild is running; queued jobs start after it." : "Idle: nothing queued.";
}
function drawMenu() {
  const m = document.getElementById("menu"); if (!m) return;
  const items = ["all", "status", "lines", "projections", "plan", "recent", "season", "model", "vs", "vs_sim"].map(catOf).filter(c => c.label);
  m.innerHTML = items.map(c => `<div class="mi"><div><b>${esc(c.label)}</b> ${c.name === "all" ? "" : asOf(c.name)}</div>${partBtn(c.name)}
    <div class="d">${esc(c.desc)}${(c.then || []).length ? ` Also redoes: ${c.then.map(x => catOf(x).label).join(", ")}.` : ""} <span class="sub">(usually ${esc(c.est || "?")})</span></div></div>`).join("")
    + `<div class="qline" id="qline"></div>`;
  paint();
}
function redraw() {  // new data -> redraw both tabs in place, keeping your place
  saveState();
  app.innerHTML = ""; render();
  if (window.__vsDone) { document.getElementById("vs").innerHTML = ""; window.__vsDone = false; }
  showTab(); restoreState(); drawMenu(); paint(); showAge();
}
async function loadNewData() {
  if (PUBLIC) {  // the published copy updates when the PC publishes it
    window.__checkVersion && [20, 45, 90, 150, 240, 330].forEach(s => setTimeout(window.__checkVersion, s * 1000)); return; }
  try {
    const nd = await (await fetch(HELPER + "/api/data", {cache: "no-store"})).json();
    if (!nd || nd.error && !nd.plan) return;
    ME = nd; setD(viewData(VIEW));
    redraw();
  } catch (e) { /* keep the current page */ }
}
async function pollJobs() {
  clearTimeout(R.timer);
  let J = null;
  try { J = await (await fetch(HELPER + "/api/jobs", {cache: "no-store"})).json(); R.online = !J.error; } catch (e) { R.online = false; }
  if (J && !J.error) {
    R.jobs = J;
    const top = (J.history[0] || {}).id || 0;
    if (R.seen === null) R.seen = top;
    else if (top > R.seen) { R.seen = top;
      if (!J.running && !(J.queue || []).length) {
        // queue empty: reload the whole page (template + data) so every change shows; your place is kept
        R.autoLoad = Date.now();
        if (!PUBLIC) { R.jobs = J; paint(); return goLatest(); }
      }
      loadNewData(); }
    else if (!J.running && !(J.queue || []).length && J.assembled_utc && D.generated_utc && Date.parse(J.assembled_utc) > Date.parse(D.generated_utc) + 1000) {
      // rebuilt by the snapshot job / daily task: redraw if you're not looking, else light up "Reload latest"
      if (document.hidden) loadNewData();
      else { const b = document.getElementById("reload"); if (b) { b.textContent = "New data ↻"; b.classList.add("fresh"); } }
    }
  }
  paint();
  const busy = J && !J.error && (J.running || (J.queue || []).length);
  R.timer = setTimeout(pollJobs, busy ? 2000 : 30000);
}
async function enqueue(part, auto) {
  if (PUBLIC && auto) return;  // the published page never calls your PC on its own
  try {
    const res = await (await fetch(HELPER + "/api/refresh", {method: "POST", cache: "no-store",
      headers: {"X-Lockin": "1", "Content-Type": "application/json"}, body: JSON.stringify({part, auto: !!auto})})).json();
    if (res.error) { R.msg[part] = "Failed to queue"; setTimeout(() => { delete R.msg[part]; paint(); }, 6000); }
    if (res.jobs) R.jobs = res.jobs;
    R.online = true;
  } catch (e) {
    R.online = false;
    if (!auto) { R.msg[part] = PUBLIC ? "Only on your PC" : "Helper not running"; setTimeout(() => { delete R.msg[part]; paint(); }, 6000); }
  }
  paint(); pollJobs();
}
window.__startRefresh = (auto) => enqueue("plan", auto);  // a game of yours went final: its lock-or-pass call
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-part]");
  if (b && !b.disabled) { e.preventDefault(); return enqueue(b.dataset.part, false); }
  const m = document.getElementById("menu"), t = e.target.closest && e.target.closest("#refreshmenu");
  if (t && m) { m.hidden = !m.hidden; if (!m.hidden) { drawMenu(); pollJobs(); } return; }
  if (m && !m.hidden && !(e.target.closest && e.target.closest("#menu"))) m.hidden = true;
  if (e.target.closest && e.target.closest("#reload")) goLatest(window.__newVersion);
});
document.addEventListener("keydown", e => { const m = document.getElementById("menu"); if (e.key === "Escape" && m) m.hidden = true; });
function showTeam(v) {
  VIEW = v; try { localStorage.setItem(VKEY, v); } catch (e) { /* not remembered */ }
  setD(viewData(v)); window.scrollTo(0, 0); redraw();
  if (D.pending_team) enqueue(`team:${D.viewing}`, false);   // first pick: build it (then only on request)
}
document.addEventListener("change", e => { if (e.target && e.target.id === "teamsel") showTeam(e.target.value); });
document.addEventListener("click", e => { if (e.target && e.target.id === "backme") { e.preventDefault(); showTeam("me"); } });
setInterval(() => { if (R.jobs && R.jobs.running) paint(); }, 1000);  // the running job's seconds counter
// back on the page (e.g. from the Sleeper app): ask the helper to check your lineup now; a change re-plans at once
// (it also checks every 30 s on its own, so the published page catches up without this)
async function lineupCheck() {
  if (PUBLIC) return;
  try {
    const res = await (await fetch(HELPER + "/api/lineup-check", {method: "POST", cache: "no-store", headers: {"X-Lockin": "1"}})).json();
    if (res && res.jobs) { R.jobs = res.jobs; paint(); if (res.result === "replan") pollJobs(); }
  } catch (e) { /* helper not running */ }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) lineupCheck(); });
window.addEventListener("focus", lineupCheck);
if (!PUBLIC) {
  // while the dashboard is open: refresh everything once the plan is 20 minutes old
  setInterval(() => { const pm = (D.parts || {}).plan;
    if (pm && pm.as_of && Date.now() - Date.parse(pm.as_of) >= 20 * 60000 && R.online) enqueue("all", true); }, 60000);
}
drawMenu(); pollJobs();

// Live scores computed in the browser (no local helper): the same numbers as lineup/live_scores.py.
// Used by the GitHub Pages copy of the dashboard, and by the local page when the helper isn't running.
// Two public, CORS-open requests: Sleeper's live week stats (your scoring) and ESPN's scoreboard.
// ctx = D.live_ctx (lineup/advisor.py -> data/tmp/live_context.json, embedded at build time).
// fetchJson(url) -> parsed JSON (throws on failure); nowMs = Date.now(). Parity-tested against Python
// in tests/test_publish.py.
const LIVE_DONE = new Set(["STATUS_FINAL", "STATUS_POSTPONED", "STATUS_CANCELED", "STATUS_SUSPENDED", "STATUS_FORFEIT"]);
const LIVE_N = 200;                      // lineup/distributions.py N
const LIVE_IN_PLAY_MS = 4 * 3600e3;      // live_scores.IN_PLAY_MAX
const LIVE_GAME_MS = (2 * 60 + 20) * 60e3;
const LIVE_DERIVED = {fgmi: [["fga", 1], ["fgm", -1]], ftmi: [["fta", 1], ["ftm", -1]], tpmi: [["tpa", 1], ["tpm", -1]],
  pts_reb_ast: [["pts", 1], ["reb", 1], ["ast", 1]], pts_reb: [["pts", 1], ["reb", 1]], pts_ast: [["pts", 1], ["ast", 1]],
  reb_ast: [["reb", 1], ["ast", 1]], blk_stl: [["blk", 1], ["stl", 1]]};

// mean of distributions.from_quantiles(q, p_play): DNP share scores 0, the rest interpolates the quantiles
function liveMeanFromQuantiles(q, pPlay) {
  q = q.slice().sort((a, b) => a - b);
  const n = LIVE_N, nDnp = Math.round((1 - Math.min(1, Math.max(0, pPlay))) * n), m = n - nDnp;
  if (m <= 0 || !q.length) return 0;
  let s = 0;
  for (let k = 0; k < m; k++) {
    const x = (k + 0.5) / m * (q.length - 1), i = Math.min(Math.floor(x), q.length - 2);
    s += q.length === 1 ? q[0] : q[i] + (q[i + 1] - q[i]) * (x - i);
  }
  return s / n;
}

// data/scoring.py fantasy_points_expr: direct stat columns, else derived ones; missing stats count 0
function liveFantasyPoints(recs, scoring) {
  const cols = new Set(); recs.forEach(r => Object.keys(r).forEach(k => cols.add(k)));
  const terms = [];
  Object.entries(scoring || {}).forEach(([k, c]) => {
    if (!c) return;
    if (cols.has(k)) terms.push(r => (Number(r[k]) || 0) * c);
    else if (LIVE_DERIVED[k] && LIVE_DERIVED[k].every(([n]) => cols.has(n)))
      terms.push(r => LIVE_DERIVED[k].reduce((a, [n, w]) => a + w * (Number(r[n]) || 0), 0) * c);
  });
  recs.forEach(r => { r.fp = terms.reduce((a, t) => a + t(r), 0); });
  return recs;
}

// Python round() on the stored double (toFixed rounds its exact decimal value, as Python does)
const rnd = (x, d) => Number(Number(x).toFixed(d));

function liveEtDate(ms) { return new Date(ms).toLocaleDateString("en-CA", {timeZone: "America/New_York"}); }

async function liveBoard(etDate, alias, fetchJson) {
  const out = {};
  let payload;
  try { payload = await fetchJson(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${etDate.replace(/-/g, "")}`); }
  catch (e) { return out; }
  (payload.events || []).forEach(ev => {
    const comp = ev.competitions[0], teams = {};
    comp.competitors.forEach(c => { teams[c.homeAway] = alias[c.team.abbreviation] || c.team.abbreviation; });
    const st = ev.status || {}, name = (st.type || {}).name, period = parseInt(st.period || 0, 10) || 0;
    const clock = (Number(st.clock) || 0) / 60;
    const left = LIVE_DONE.has(name) ? 0 : period <= 0 ? 1 : period <= 4 ? Math.max(0, ((4 - period) * 12 + clock) / 48) : 0;
    out[`${teams.home}|${teams.away}`] = {status: name, left};
  });
  return out;
}

async function computeLiveBrowser(ctx, fetchJson, nowMs) {
  const out = {as_of_utc: new Date(nowMs).toISOString(), context_utc: ctx ? ctx.written_utc : null, games: {}, players: {}, source: "browser"};
  if (!ctx) return out;
  const started = Object.entries(ctx.games || {}).filter(([, g]) => { if (!g.tip_utc) return false;
    const dt = nowMs - Date.parse(g.tip_utc); return dt >= 0 && dt <= LIVE_IN_PLAY_MS; });
  if (!started.length) return out;
  const board = {};
  for (const d of [...new Set(started.map(([, g]) => liveEtDate(Date.parse(g.tip_utc))))].sort())
    Object.assign(board, await liveBoard(d, ctx.espn_alias || {}, fetchJson));
  started.forEach(([gid, g]) => {
    const b = board[`${g.home}|${g.away}`];
    const left = b ? b.left : Math.max(0, 1 - (nowMs - Date.parse(g.tip_utc)) / LIVE_GAME_MS);
    out.games[gid] = {status: b ? b.status : null, left: rnd(left, 3), final: !!(b && LIVE_DONE.has(b.status))};
  });
  const rows = await fetchJson(`https://api.sleeper.com/stats/nba/${ctx.season}/${ctx.week}?season_type=regular`) || [];
  const recs = rows.filter(r => /^\d+$/.test(String(r.player_id)) && r.stats && Object.keys(r.stats).length)
    .map(r => Object.assign({}, r.stats, {player_id: String(r.player_id), game_id: String(r.game_id), date: r.date}))
    .sort((a, b) => a.player_id < b.player_id ? -1 : a.player_id > b.player_id ? 1 : String(a.date) < String(b.date) ? -1 : String(a.date) > String(b.date) ? 1 : 0);
  const line = {};
  liveFantasyPoints(recs, ctx.scoring).forEach(r => { line[`${r.player_id}|${r.game_id}`] = r; });
  const r1 = (x) => rnd(x, 1);
  (ctx.players || []).forEach(p => {
    const gm = out.games[p.game_id]; if (!gm) return;
    const ln = line[`${p.player_id}|${p.game_id}`] || {};
    const soFar = Number(ln.fp) || 0, mins = Number(ln.min) || 0;
    const mean = liveMeanFromQuantiles(p.fp_q.map(q => soFar + gm.left * q), mins > 0 ? 1 : p.p_play);
    out.players[`${p.player_id}|${p.game_id}`] = {so_far: r1(soFar), minutes: r1(mins), left: rnd(gm.left, 2),
      proj_final: r1(gm.final ? soFar : mean), final: gm.final};
  });
  return out;
}

if (typeof module !== "undefined") module.exports = {computeLiveBrowser, liveMeanFromQuantiles, liveFantasyPoints};

// ---- live scores: fast path through the helper (/api/live, no model run), every 90 s while a game is on.
// Patches the live numbers into D and redraws in place (no reload). A game of yours going final triggers a full
// refresh so its lock-or-pass call shows up.
(function () {
  if (!D || D.error) return;
  const API = "http://127.0.0.1:8766/api/live", IN_PLAY = 4 * 3600e3;
  const rows = () => [...(D.plan || []).flatMap(s => [...(s.steps || []), ...(s.fills || [])]),
    ...Object.values(D.mode_plans || {}).flatMap(mp => mp.flatMap(s => [...(s.steps || []), ...(s.fills || [])])),
    ...(D.tonight || []), ...((D.opponent || {}).players || []).map(x => Object.assign(x, {tip_utc: x.tip_utc || x.next_tip}))];
  const onNow = () => rows().some(x => { const dt = Date.now() - new Date(x.tip_utc).getTime(); return x.game_id && dt >= 0 && dt < IN_PLAY && !(x.live && x.live.final); });
  const mine = () => new Set((D.plan || []).flatMap(s => (s.steps || []).map(x => x.player_id + "|" + x.game_id)));
  let wasFinal = new Set(rows().filter(x => x.live && x.live.final).map(x => x.player_id + "|" + x.game_id));
  // the local helper when it's reachable (local page only); otherwise straight from Sleeper + ESPN in this browser
  const viaBrowser = () => computeLiveBrowser(D.live_ctx, async (u) => { const res = await fetch(u, {cache: "no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); }, Date.now());
  const tick = async () => {
    if (!onNow()) return;
    let r = null;
    if (!PUBLIC) { try { r = await (await fetch(API, {cache: "no-store"})).json(); } catch (e) { r = null; } }
    if ((!r || r.error || !r.players) && D.live_ctx) { try { r = await viaBrowser(); } catch (e) { r = null; } }
    if (!r || r.error || !r.players) return;
    let newFinal = false;
    rows().forEach(x => { const k = x.player_id + "|" + x.game_id, v = r.players[k]; if (!v) return;
      x.live = v; if ("mean" in x && !("next_tip" in x)) x.mean = v.proj_final;
      if (v.final && !wasFinal.has(k)) { wasFinal.add(k); if (mine().has(k)) newFinal = true; } });
    D.live_as_of = r.as_of_utc;
    window.__liveMap = Object.assign({}, liveMap(), r.players);
    const el = document.getElementById("liveage"); if (el) el.textContent = `· live ${local(r.as_of_utc)}`;
    try { window.__redrawLive(); } catch (e) { /* keep polling */ }
    if (newFinal && window.__startRefresh) window.__startRefresh(true);
  };
  tick(); setInterval(tick, PUBLIC ? 60000 : 90000);
})();

// published copy: notice a newer publish (version.json, written by scripts/publish_pages.py). Hidden tab -> load it;
// visible -> light up "Reload latest" so the page never jumps while you read.
(function () {
  if (!PUBLIC || !D) return;
  const check = async () => {
    let v; try { v = await (await fetch("version.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) { return; }
    if (!v || !v.generated_utc || !D.generated_utc || Date.parse(v.generated_utc) <= Date.parse(D.generated_utc)) return;
    window.__newVersion = v.generated_utc;
    // hidden tab, or your queue just emptied (the publish of its build lands a few minutes later): load it
    if (document.hidden || (R.autoLoad && Date.now() - R.autoLoad < 15 * 60000)) return goLatest(v.generated_utc);
    const b = document.getElementById("reload");
    if (b) { b.textContent = "New data ↻"; b.classList.add("fresh"); b.title = `A newer build was published (${local(v.generated_utc)}). Click to load it.`; }
  };
  window.__checkVersion = check;
  setTimeout(check, 5000); setInterval(check, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
})();

// data age + quiet auto-refresh: only while the page is NOT visible, so it never moves you while reading
const loadedAt = Date.now();
function showAge() {
  const el = document.getElementById("age"); if (!el || !D || !D.generated_utc) return;
  const mins = Math.round((Date.now() - new Date(D.generated_utc).getTime()) / 60000);
  el.textContent = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
}
showAge(); setInterval(showAge, 30000);
setInterval(() => { if (!PUBLIC && document.hidden && Date.now() - loadedAt > 10 * 60000) { saveState(); location.reload(); } }, 60000);
